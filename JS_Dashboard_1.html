<script>
function loadTodayAttendance() {

      if (!SESSION_TOKEN) {
        console.warn(
          'JNDA: Session token tidak tersedia.'
        );

        return;
      }


      google.script.run

        .withSuccessHandler(
          function (result) {

            console.log(
              'JNDA Today Attendance:',
              result
            );


            /*
            * Backend SVC_Attendance.gs:
            *
            * {
            *   success: true,
            *   exists: true,
            *   status: 'OPEN',
            *   attendance: {...}
            * }
            *
            * atau:
            *
            * {
            *   success: true,
            *   exists: false,
            *   status: 'BELUM_ABSEN',
            *   attendance: null
            * }
            */


            if (
              !result ||
              result.success === false
            ) {

              renderTodayAttendance({
                today: null
              });

              return;

            }


            /*
            * Response backend langsung menggunakan
            * property "attendance".
            */
            const attendance =
              result.attendance || null;


            renderTodayAttendance({

              today:
                attendance || null

            });


            /*
            * Saat ini getTodayAttendance()
            * hanya mengembalikan attendance hari ini.
            *
            * Recent attendance belum diambil di sini.
            */
            renderRecentAttendance({

              recent: []

            });

          }
        )

        .withFailureHandler(
          function (error) {

            console.error(
              'JNDA Today Attendance Error:',
              error
            );


            /*
            * Jangan membuat seluruh dashboard
            * gagal hanya karena attendance gagal.
            */

            renderTodayAttendance({
              today: null
            });

          }
        )

        .getTodayAttendance(
          SESSION_TOKEN
        );

    }


    /* =======================================================
       PROFILE CONTEXT
       ======================================================= */

    function renderProfileContext(
      branch,
      ship,
      position,
      shift
    ) {

      const container =
        document.getElementById(
          'profileContext'
        );


      if (!container) {
        return;
      }


      container.innerHTML = '';


      const values = [];


      if (
        branch &&
        branch !== '-'
      ) {

        values.push(
          '📍 ' + branch
        );

      }


      if (
        ship &&
        ship !== '-'
      ) {

        values.push(
          '🚢 ' + ship
        );

      }


      if (
        position &&
        position !== '-'
      ) {

        values.push(
          '💼 ' + position
        );

      }


      if (
        shift &&
        shift !== '-'
      ) {

        values.push(
          '🕐 ' + shift
        );

      }


      if (!values.length) {

        values.push(
          'Penempatan belum tersedia'
        );

      }


      values.forEach(
        function (value) {

          const chip =
            document.createElement(
              'span'
            );

          chip.className =
            'context-chip';

          chip.textContent =
            value;

          container.appendChild(
            chip
          );

        }
      );

    }


    /* =======================================================
       WORK CONTEXT
       ======================================================= */

    function buildWorkContext(
      branch,
      ship
    ) {

      if (
        ship &&
        ship !== '-'
      ) {

        return 'Kapal · ' + ship;

      }


      if (
        branch &&
        branch !== '-'
      ) {

        return 'Cabang / Unit · ' + branch;

      }


      return 'Penempatan belum tersedia';

    }


    /* =======================================================
       TODAY ATTENDANCE
       ======================================================= */

    function renderTodayAttendance(
      attendance
    ) {

      attendance =
        attendance || {};


      const today =
        attendance.today ||
        attendance.todayAttendance ||
        attendance.current ||
        {};


      /*
      * Data belum tersedia.
      * Gunakan placeholder agar UI tidak kosong.
      */

      const hasAttendance =
        Object.keys(today).length > 0;


      const checkIn =
        firstValidValue(
          today.checkInAt,
          today.checkIn,
          today.CHECK_IN_AT,
          today.CHECK_IN,
          '-'
        );


      const checkOut =
        firstValidValue(
          today.checkOutAt,
          today.checkOut,
          today.CHECK_OUT_AT,
          today.CHECK_OUT,
          '-'
        );


      const working =
        firstValidValue(
          today.workingMinutes,
          today.WORKING_MINUTES,
          today.workingHour,
          today.WORKING_HOUR,
          '-'
        );


      const status =
        firstValidValue(
          today.status,
          today.STATUS,
          'Belum Absen'
        );


      setText(
        'todayCheckIn',
        formatTime(checkIn)
      );


      setText(
        'todayCheckOut',
        formatTime(checkOut)
      );


      setText(
        'todayWorkingHours',
        formatWorkingMinutes(working)
      );


      setText(
        'todayStatus',
        formatAttendanceStatus(status)
      );


      applyStatusClass(
        'todayStatus',
        status
      );

    }


    /* =======================================================
       RECENT ATTENDANCE
       ======================================================= */

    function renderRecentAttendance(
      attendance
    ) {

      const rows =
        attendance.recent ||
        attendance.recentAttendance ||
        attendance.rows ||
        [];


      const tbody =
        document.getElementById(
          'recentAttendanceBody'
        );


      if (!tbody) {
        return;
      }


      tbody.innerHTML = '';


      if (
        !Array.isArray(rows) ||
        rows.length === 0
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state">
                Belum ada data kehadiran.
              </div>
            </td>
          </tr>
        `;

        return;

      }


      rows
        .slice(0, 7)
        .forEach(
          function (row) {

            const tr =
              document.createElement(
                'tr'
              );


            const date =
              firstValidValue(
                row.workDate,
                row.WORK_DATE,
                row.attendanceDate,
                row.ATTENDANCE_DATE,
                '-'
              );


            const checkIn =
              firstValidValue(
                row.checkInAt,
                row.checkIn,
                row.CHECK_IN_AT,
                row.CHECK_IN,
                '-'
              );


            const checkOut =
              firstValidValue(
                row.checkOutAt,
                row.checkOut,
                row.CHECK_OUT_AT,
                row.CHECK_OUT,
                '-'
              );


            const working =
              firstValidValue(
                row.workingMinutes,
                row.WORKING_MINUTES,
                '-'
              );


            const status =
              firstValidValue(
                row.status,
                row.STATUS,
                '-'
              );


            tr.innerHTML = `

              <td>
                ${escapeHtml(
                  formatDate(date)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(checkIn)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(checkOut)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatWorkingMinutes(
                    working
                  )
                )}
              </td>

              <td>
                <span class="
                  status-pill
                  ${getStatusClass(status)}
                ">
                  ${escapeHtml(
                    formatAttendanceStatus(
                      status
                    )
                  )}
                </span>
              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );

    }


    /* =======================================================
       MANAGEMENT
       ======================================================= */

</script>

<!DOCTYPE html>
<html lang="id">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,

  <title>

<body>

  <script>

    /* =======================================================
       JNDA V3 - DASHBOARD PAGE
       ======================================================= */

    let SESSION_TOKEN = '';
    let CURRENT_SESSION = null;
    let DASHBOARD_DATA = null;

    const WEB_APP_URL =
      <?!= JSON.stringify(WEB_APP_URL) ?>;


    /* =======================================================
       INITIALIZATION
       ======================================================= */

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        startDashboard();

        startClock();

        initAttendanceModal();

        initDinasAttachment();

      }
    );

    function initAttendanceModal() {

      const remark =
        document.getElementById(
          'checkInRemark'
        );


      if (remark) {

        remark.addEventListener(
          'input',
          updateRemarkCounter
        );

      }

      const checkInMode =
        document.getElementById(
          'checkInMode'
        );


      const checkInEmployeeType =
        document.getElementById(
          'checkInEmployeeType'
        );


      if (checkInMode) {

        checkInMode.addEventListener(
          'change',
          updateCheckInShiftUI
        );

      }


      if (checkInEmployeeType) {

        checkInEmployeeType.addEventListener(
          'change',
          updateCheckInShiftUI
        );

      }


      /*
      * ESC untuk menutup modal
      */

      document.addEventListener(
        'keydown',
        function (event) {

          if (
            event.key === 'Escape'
          ) {

            const modal =
              document.getElementById(
                'checkInModal'
              );

            if (
              modal &&
              modal.classList.contains('show')
            ) {

              closeCheckInModal();

            }

          }

        }
      );

    }


    /* =======================================================
       START DASHBOARD
       ======================================================= */

    function startDashboard() {

      SESSION_TOKEN =
        localStorage.getItem(
          'JNDA_SESSION_TOKEN'
        );


      if (!SESSION_TOKEN) {

        redirectToLogin();

        return;

      }


      google.script.run
        .withSuccessHandler(
          handleDashboardSuccess
        )
        .withFailureHandler(
          handleDashboardError
        )
        .getDashboardData(
          SESSION_TOKEN
        );

    }


    /* =======================================================
       SUCCESS
       ======================================================= */

    function handleDashboardSuccess(result) {

      if (
        !result ||
        result.success === false
      ) {

        redirectToLogin();

        return;

      }


      DASHBOARD_DATA =
        result.data || result;


      CURRENT_SESSION =
        DASHBOARD_DATA.session ||
        result.session ||
        null;


      renderDashboard(
        DASHBOARD_DATA
      );

    }


    /* =======================================================
       ERROR
       ======================================================= */

    function handleDashboardError(error) {

        console.error(
          'Dashboard error:',
          error
        );

        const loading =
          document.getElementById(
            'dashboardLoading'
          );

        if (loading) {

          loading.style.display = 'flex';

          loading.innerHTML = `

            <div style="
              width:100%;
              max-width:420px;
              padding:30px;
              border-radius:20px;
              background:#ffffff;
              box-shadow:0 15px 45px rgba(15,23,42,.12);
              text-align:center;
            ">

              <div style="
                font-size:38px;
                margin-bottom:12px;
              ">
                ⚠️
              </div>

              <div style="
                font-size:18px;
                font-weight:800;
                color:#172033;
              ">
                Dashboard gagal dimuat
              </div>

              <div style="
                margin-top:8px;
                font-size:12px;
                color:#728096;
                line-height:1.6;
              ">
                Terjadi masalah saat mengambil
                data dashboard.
              </div>

              <button
                type="button"
                onclick="location.reload()"
                style="
                  margin-top:18px;
                  border:0;
                  border-radius:10px;
                  padding:11px 18px;
                  background:#16458f;
                  color:#fff;
                  font-weight:700;
                  cursor:pointer;
                "
              >
                Coba Lagi
              </button>

            </div>

          `;

        }

      }


    /* =======================================================
       RENDER DASHBOARD
       ======================================================= */

    function renderDashboard(data) {

      console.log(
        'JNDA Dashboard Data:',
        data
      );


      const employee =
        data.employee || {};


      const user =
        data.user || {};


      const role =
        data.role || {};

      const management =
        data.management || {};


      /*
       * =====================================================
       * USER NAME
       * =====================================================
       */

      const employeeName =
        firstValidValue(
          employee.fullName,
          employee.employeeName,
          employee.name,
          user.fullName,
          user.name,
          user.username,
          'Pegawai'
        );


      const employeeId =
        firstValidValue(
          employee.employeeId,
          employee.EMPLOYEE_ID,
          user.employeeId,
          user.EMPLOYEE_ID,
          '-'
        );


      const employeeNip =
        firstValidValue(
          employee.nip,
          employee.NIP,
          employeeId,
          '-'
        );


      /*
       * =====================================================
       * ROLE
       * =====================================================
       */

      const roleName =
        firstValidValue(
          role.name,
          role.roleName,
          role.ROLE_NAME,
          user.roleName,
          user.role,
          ''
        );


      /*
       * =====================================================
       * CONTEXT
       * =====================================================
       */

      const organization =
        data.organization || {};


      const branchName =
        firstValidValue(
          organization.branch,
          employee.branchName,
          employee.BRANCH_NAME,
          employee.branch,
          '-'
        );


      const shipName =
        firstValidValue(
          organization.ship,
          employee.shipName,
          employee.SHIP_NAME,
          employee.ship,
          '-'
        );


      const positionName =
        firstValidValue(
          organization.position,
          employee.positionName,
          employee.POSITION_NAME,
          employee.position,
          '-'
        );

      const shiftName =
        firstValidValue(
          organization.shift,
          employee.shiftName,
          employee.SHIFT_NAME,
          employee.shift,
          '-'
        );


      /*
       * =====================================================
       * HERO
       * =====================================================
       */

      setText(
        'welcomeName',
        employeeName
      );


      setText(
        'welcomeEmployeeId',
        employeeId
      );


      setText(
        'welcomeContext',
        buildWorkContext(
          branchName,
          shipName
        )
      );


      /*
       * =====================================================
       * PROFILE
       * =====================================================
       */

      setText(
        'profileName',
        employeeName
      );


      setText(
        'profileEmployeeId',
        'NIP: ' + employeeNip
      );


      setInitial(
        'profileAvatar',
        employeeName
      );


      setInitial(
        'topAvatar',
        employeeName
      );


      setText(
        'topUserName',
        employeeName
      );


      setText(
        'topUserRole',
        formatRoleName(roleName)
      );


      renderProfileContext(
        branchName,
        shipName,
        positionName,
        shiftName
      );


      /*
       * =====================================================
       * INFO PENEMPATAN
       * =====================================================
       */

      setText(
        'infoBranch',
        branchName
      );


      setText(
        'infoShip',
        shipName
      );


      setText(
        'infoPosition',
        positionName
      );


      setText(
        'infoShift',
        shiftName
      );


      /* =====================================================
        ATTENDANCE
        ===================================================== */

      /*
      * Attendance sengaja tidak diambil dari
      * getDashboardData() agar dashboard ringan.
      *
      * Data attendance dimuat terpisah setelah
      * informasi pegawai selesai ditampilkan.
      */

      renderTodayAttendance({
        today: null
      });

      renderRecentAttendance({
        recent: []
      });

      /*
      * Load attendance setelah dashboard utama
      * selesai dirender.
      */
      loadTodayAttendance();


      /*
       * =====================================================
       * ROLE MENU
       * =====================================================
       */

      configureRoleMenus(
        employeeId,
        roleName
      );


      /*
       * =====================================================
       * SHOW DASHBOARD
       * =====================================================
       */

      hideDashboardLoading();

    }

    /* =======================================================
      LOAD TODAY ATTENDANCE
      ======================================================= */

    function loadTodayAttendance() {

      if (!SESSION_TOKEN) {
        console.warn(
          'JNDA: Session token tidak tersedia.'
        );

        return;
      }


      google.script.run

        .withSuccessHandler(
          function (result) {

            console.log(
              'JNDA Today Attendance:',
              result
            );


            /*
            * Backend SVC_Attendance.gs:
            *
            * {
            *   success: true,
            *   exists: true,
            *   status: 'OPEN',
            *   attendance: {...}
            * }
            *
            * atau:
            *
            * {
            *   success: true,
            *   exists: false,
            *   status: 'BELUM_ABSEN',
            *   attendance: null
            * }
            */


            if (
              !result ||
              result.success === false
            ) {

              renderTodayAttendance({
                today: null
              });

              return;

            }


            /*
            * Response backend langsung menggunakan
            * property "attendance".
            */
            const attendance =
              result.attendance || null;


            renderTodayAttendance({

              today:
                attendance || null

            });


            /*
            * Saat ini getTodayAttendance()
            * hanya mengembalikan attendance hari ini.
            *
            * Recent attendance belum diambil di sini.
            */
            renderRecentAttendance({

              recent: []

            });

          }
        )

        .withFailureHandler(
          function (error) {

            console.error(
              'JNDA Today Attendance Error:',
              error
            );


            /*
            * Jangan membuat seluruh dashboard
            * gagal hanya karena attendance gagal.
            */

            renderTodayAttendance({
              today: null
            });

          }
        )

        .getTodayAttendance(
          SESSION_TOKEN
        );

    }


    /* =======================================================
       PROFILE CONTEXT
       ======================================================= */

    function renderProfileContext(
      branch,
      ship,
      position,
      shift
    ) {

      const container =
        document.getElementById(
          'profileContext'
        );


      if (!container) {
        return;
      }


      container.innerHTML = '';


      const values = [];


      if (
        branch &&
        branch !== '-'
      ) {

        values.push(
          '📍 ' + branch
        );

      }


      if (
        ship &&
        ship !== '-'
      ) {

        values.push(
          '🚢 ' + ship
        );

      }


      if (
        position &&
        position !== '-'
      ) {

        values.push(
          '💼 ' + position
        );

      }


      if (
        shift &&
        shift !== '-'
      ) {

        values.push(
          '🕐 ' + shift
        );

      }


      if (!values.length) {

        values.push(
          'Penempatan belum tersedia'
        );

      }


      values.forEach(
        function (value) {

          const chip =
            document.createElement(
              'span'
            );

          chip.className =
            'context-chip';

          chip.textContent =
            value;

          container.appendChild(
            chip
          );

        }
      );

    }


    /* =======================================================
       WORK CONTEXT
       ======================================================= */

    function buildWorkContext(
      branch,
      ship
    ) {

      if (
        ship &&
        ship !== '-'
      ) {

        return 'Kapal · ' + ship;

      }


      if (
        branch &&
        branch !== '-'
      ) {

        return 'Cabang / Unit · ' + branch;

      }


      return 'Penempatan belum tersedia';

    }


    /* =======================================================
       TODAY ATTENDANCE
       ======================================================= */

    function renderTodayAttendance(
      attendance
    ) {

      attendance =
        attendance || {};


      const today =
        attendance.today ||
        attendance.todayAttendance ||
        attendance.current ||
        {};


      /*
      * Data belum tersedia.
      * Gunakan placeholder agar UI tidak kosong.
      */

      const hasAttendance =
        Object.keys(today).length > 0;


      const checkIn =
        firstValidValue(
          today.checkInAt,
          today.checkIn,
          today.CHECK_IN_AT,
          today.CHECK_IN,
          '-'
        );


      const checkOut =
        firstValidValue(
          today.checkOutAt,
          today.checkOut,
          today.CHECK_OUT_AT,
          today.CHECK_OUT,
          '-'
        );


      const working =
        firstValidValue(
          today.workingMinutes,
          today.WORKING_MINUTES,
          today.workingHour,
          today.WORKING_HOUR,
          '-'
        );


      const status =
        firstValidValue(
          today.status,
          today.STATUS,
          'Belum Absen'
        );


      setText(
        'todayCheckIn',
        formatTime(checkIn)
      );


      setText(
        'todayCheckOut',
        formatTime(checkOut)
      );


      setText(
        'todayWorkingHours',
        formatWorkingMinutes(working)
      );


      setText(
        'todayStatus',
        formatAttendanceStatus(status)
      );


      applyStatusClass(
        'todayStatus',
        status
      );

    }


    /* =======================================================
       RECENT ATTENDANCE
       ======================================================= */

    function renderRecentAttendance(
      attendance
    ) {

      const rows =
        attendance.recent ||
        attendance.recentAttendance ||
        attendance.rows ||
        [];


      const tbody =
        document.getElementById(
          'recentAttendanceBody'
        );


      if (!tbody) {
        return;
      }


      tbody.innerHTML = '';


      if (
        !Array.isArray(rows) ||
        rows.length === 0
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state">
                Belum ada data kehadiran.
              </div>
            </td>
          </tr>
        `;

        return;

      }


      rows
        .slice(0, 7)
        .forEach(
          function (row) {

            const tr =
              document.createElement(
                'tr'
              );


            const date =
              firstValidValue(
                row.workDate,
                row.WORK_DATE,
                row.attendanceDate,
                row.ATTENDANCE_DATE,
                '-'
              );


            const checkIn =
              firstValidValue(
                row.checkInAt,
                row.checkIn,
                row.CHECK_IN_AT,
                row.CHECK_IN,
                '-'
              );


            const checkOut =
              firstValidValue(
                row.checkOutAt,
                row.checkOut,
                row.CHECK_OUT_AT,
                row.CHECK_OUT,
                '-'
              );


            const working =
              firstValidValue(
                row.workingMinutes,
                row.WORKING_MINUTES,
                '-'
              );


            const status =
              firstValidValue(
                row.status,
                row.STATUS,
                '-'
              );


            tr.innerHTML = `

              <td>
                ${escapeHtml(
                  formatDate(date)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(checkIn)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(checkOut)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatWorkingMinutes(
                    working
                  )
                )}
              </td>

              <td>
                <span class="
                  status-pill
                  ${getStatusClass(status)}
                ">
                  ${escapeHtml(
                    formatAttendanceStatus(
                      status
                    )
                  )}
                </span>
              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );

    }


    /* =======================================================
       MANAGEMENT
       ======================================================= */

    function renderManagement(
      management
    ) {

      if (!management) {
        return;
      }


      setText(
        'managementEmployees',
        firstValidValue(
          management.activeEmployees,
          management.totalEmployees,
          management.employeeCount,
          0
        )
      );


      setText(
        'managementPresent',
        firstValidValue(
          management.presentToday,
          management.present,
          0
        )
      );


      setText(
        'managementAbsent',
        firstValidValue(
          management.absentToday,
          management.absent,
          0
        )
      );


      setText(
        'managementLate',
        firstValidValue(
          management.lateToday,
          management.late,
          0
        )
      );

    }


    /* =======================================================
       ROLE MENUS
       ======================================================= */

    function configureRoleMenus(
      employeeId,
      roleName
    ) {

      const normalized =
        normalizeRole(
          roleName
        );


      const hasEmployee =
        !!employeeId &&
        employeeId !== '-';

      const branchAdminRoles = [
        'ADMIN_CABANG'
      ];

      const isBranchAdmin =
        branchAdminRoles.includes(normalized);


      const managementRoles = [
        'DIREKSI',
        'DIRECTOR',
        'DIREKTUR',
        'MANAGER',
        'BRANCH MANAGER',
        'ADMIN',
        'ADMIN HR',
        'ADMINISTRATOR'
      ];


      const adminRoles = [
        'ADMIN',
        'ADMIN HR',
        'ADMINISTRATOR'
      ];


      const isManagement =
        managementRoles.includes(
          normalized
        );


      const isAdmin =
        adminRoles.includes(
          normalized
        );


      /*
       * Employee menu:
       *
       * ADMIN dan ADMIN_HR juga masuk
       * karena mereka tetap pegawai.
       */

      const employeeMenu =
        document.getElementById(
          'employeeMenuGroup'
        );


      if (employeeMenu) {

        employeeMenu.style.display =
          hasEmployee
            ? 'block'
            : 'none';

      }


      const managementMenu =
        document.getElementById(
          'managementMenuGroup'
        );


      if (managementMenu) {

        managementMenu.style.display =
          isManagement
            ? 'block'
            : 'none';

      }


      const adminMenu =
        document.getElementById(
          'adminMenuGroup'
        );


      if (adminMenu) {

        adminMenu.style.display =
          isAdmin
            ? 'block'
            : 'none';

      }

      const scheduleMenu =
        document.getElementById(
          'scheduleMenuGroup'
        );

      if (scheduleMenu) {
        scheduleMenu.style.display =
          isBranchAdmin
            ? 'block'
            : 'none';
      }


      const managementSection =
        document.getElementById(
          'managementSection'
        );


      if (managementSection) {

        managementSection.style.display =
          isManagement
            ? 'block'
            : 'none';

      }


      /*
       * Render management data
       */

      if (isManagement) {

        renderManagement(
          DASHBOARD_DATA.management || {}
        );

      }

    }


    /* =======================================================
       ATTENDANCE NAVIGATION
       ======================================================= */

    function openAttendance(
      mode
    ) {

      closeMobileSidebar();


      navigateTo(
        'attendance',
        mode
      );

    }


    /* =======================================================
       NAVIGATION MPA
       ======================================================= */

    function navigateTo(page, mode) {

      closeMobileSidebar();

      let url =
        WEB_APP_URL +
        '?page=' +
        encodeURIComponent(page);

      if (mode) {

        url +=
          '&mode=' +
          encodeURIComponent(mode);

      }

      window.open(
        url,
        '_top'
      );

    }


    /* =======================================================
       LOGIN REDIRECT
       ======================================================= */

    function redirectToLogin() {

      localStorage.removeItem(
        'JNDA_SESSION_TOKEN'
      );

      const url =
        WEB_APP_URL +
        '?page=login';

      window.open(
        url,
        '_top'
      );

    }


    


    /* =======================================================
       LOGOUT
       ======================================================= */

      function logoutUser() {

        const token =
          SESSION_TOKEN ||
          localStorage.getItem(
            'JNDA_SESSION_TOKEN'
          );

        /*
        * Hapus token lokal terlebih dahulu.
        */
        localStorage.removeItem(
          'JNDA_SESSION_TOKEN'
        );

        SESSION_TOKEN = '';


        /*
        * Kalau tidak ada token,
        * langsung kembali ke login.
        */
        if (!token) {

          redirectToLogin();

          return;

        }


        /*
        * Hapus session di server.
        */
        google.script.run

          .withSuccessHandler(
            function () {

              redirectToLogin();

            }
          )

          .withFailureHandler(
            function (error) {

              console.error(
                'Logout server error:',
                error
              );

              /*
              * Walaupun server gagal,
              * token lokal sudah dihapus.
              */
              redirectToLogin();

            }
          )

          .destroySession(
            token
          );

      }


    /* =======================================================
       MOBILE SIDEBAR
       ======================================================= */

    function toggleMobileSidebar() {

      const sidebar =
        document.getElementById(
          'jndaSidebar'
        );


      const overlay =
        document.getElementById(
          'sidebarOverlay'
        );


      if (!sidebar) {
        return;
      }


      const opening =
        !sidebar.classList.contains(
          'mobile-open'
        );


      if (opening) {

        sidebar.classList.add(
          'mobile-open'
        );


        if (overlay) {

          overlay.classList.add(
            'mobile-open'
          );

        }

      } else {

        closeMobileSidebar();

      }

    }


    function closeMobileSidebar() {

      const sidebar =
        document.getElementById(
          'jndaSidebar'
        );


      const overlay =
        document.getElementById(
          'sidebarOverlay'
        );


      if (sidebar) {

        sidebar.classList.remove(
          'mobile-open'
        );

      }


      if (overlay) {

        overlay.classList.remove(
          'mobile-open'
        );

      }

    }


    /* =======================================================
   DIGITAL CLOCK
   ======================================================= */

      let EMPLOYEE_TIMEZONE = 'Asia/Jakarta';
      let EMPLOYEE_TIMEZONE_LABEL = 'WIB';


      function startClock() {

        updateClock();

        setInterval(
          updateClock,
          1000
        );

      }


      function updateClock() {

        const now = new Date();

        const timeText =
          new Intl.DateTimeFormat(
            'id-ID',
            {
              timeZone: EMPLOYEE_TIMEZONE,

              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',

              hour12: false
            }
          ).format(now);


        const clock =
          document.getElementById(
            'digitalClock'
          );


        if (clock) {

          clock.textContent =
            timeText;

        }


        const zone =
          document.getElementById(
            'digitalClockZone'
          );


        if (zone) {

          zone.textContent =
            EMPLOYEE_TIMEZONE_LABEL;

        }


        /* tanggal dashboard */

        const dateText =
          new Intl.DateTimeFormat(
            'id-ID',
            {
              timeZone: EMPLOYEE_TIMEZONE,

              weekday: 'long',
              day: '2-digit',
              month: 'long',
              year: 'numeric'
            }
          ).format(now);


        const pageDate =
          document.getElementById(
            'pageDate'
          );


        if (pageDate) {

          pageDate.textContent =
            dateText;

        }

      }


    /* =======================================================
       LOADING
       ======================================================= */

    function hideDashboardLoading() {

      const loading =
        document.getElementById(
          'dashboardLoading'
        );


      const content =
        document.getElementById(
          'dashboardContent'
        );


      if (loading) {

        loading.style.display =
          'none';

      }


      if (content) {

        content.style.display =
          'block';

      }

    }


    /* =======================================================
       HELPERS
       ======================================================= */

    function setText(
      id,
      value
    ) {

      const element =
        document.getElementById(
          id
        );


      if (!element) {
        return;
      }


      element.textContent =
        value == null
          ? '-'
          : String(value);

    }


    function setInitial(
      id,
      name
    ) {

      const element =
        document.getElementById(
          id
        );


      if (!element) {
        return;
      }


      const text =
        String(
          name || 'P'
        ).trim();


      element.textContent =
        text
          ? text
              .charAt(0)
              .toUpperCase()
          : 'P';

    }


    function firstValidValue() {

      const values =
        Array.from(
          arguments
        );


      for (
        let i = 0;
        i < values.length;
        i++
      ) {

        const value =
          values[i];


        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ''
        ) {

          return value;

        }

      }


      return '-';

    }


    function normalizeRole(
      role
    ) {

      return String(
        role || ''
      )
        .trim()
        .toUpperCase()
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ');

    }


    function formatRoleName(
      role
    ) {

      const normalized =
        normalizeRole(
          role
        );


      if (!normalized) {
        return 'Pegawai';
      }


      return normalized;

    }


    /* =======================================================
       DATE / TIME
       ======================================================= */

    function formatDate(
      value
    ) {

      if (
        !value ||
        value === '-'
      ) {

        return '-';

      }


      try {

        const date =
          new Date(value);


        if (
          isNaN(
            date.getTime()
          )
        ) {

          return String(value);

        }


        return new Intl.DateTimeFormat(
          'id-ID',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            timeZone: 'Asia/Jakarta'
          }
        ).format(date);

      } catch (error) {

        return String(value);

      }

    }


    function formatTime(
      value
    ) {

      if (
        !value ||
        value === '-'
      ) {

        return '-';

      }


      /*
       * Jika server sudah mengirim
       * format HH:mm / HH:mm:ss.
       */

      if (
        typeof value === 'string' &&
        /^\d{1,2}:\d{2}/.test(
          value
        )
      ) {

        return value.substring(
          0,
          5
        );

      }


      try {

        const date =
          new Date(value);


        if (
          isNaN(
            date.getTime()
          )
        ) {

          return String(value);

        }


        return new Intl.DateTimeFormat(
          'id-ID',
          {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
            timeZone: 'Asia/Jakarta'
          }
        ).format(date);

      } catch (error) {

        return String(value);

      }

    }


    function formatWorkingMinutes(
      value
    ) {

      if (
        value === undefined ||
        value === null ||
        value === '' ||
        value === '-'
      ) {

        return '-';

      }


      /*
       * V3 menggunakan WORKING_MINUTES
       * sebagai nilai authoritative.
       */

      const minutes =
        Number(value);


      if (
        !isFinite(minutes) ||
        minutes < 0
      ) {

        return '-';

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      const mins =
        Math.round(
          minutes % 60
        );


      return (
        hours +
        ' jam ' +
        String(mins).padStart(
          2,
          '0'
        ) +
        ' mnt'
      );

    }


    /* =======================================================
       STATUS
       ======================================================= */

    function formatAttendanceStatus(
      status
    ) {

      const value =
        String(
          status || ''
        )
          .trim()
          .toUpperCase();


      const map = {

        PRESENT:
          'Hadir',

        HADIR:
          'Hadir',

        COMPLETE:
          'Lengkap',

        COMPLETED:
          'Lengkap',

        OPEN:
          'Belum Pulang',

        OPEN_OVERDUE:
          'Belum Pulang',

        LATE:
          'Terlambat',

        ABSENT:
          'Tidak Hadir',

        BELUM_ABSEN:
          'Belum Absen'

      };


      return (
        map[value] ||
        status ||
        '-'
      );

    }


    function getStatusClass(
      status
    ) {

      const value =
        String(
          status || ''
        )
          .trim()
          .toUpperCase();


      if (
        [
          'PRESENT',
          'HADIR',
          'COMPLETE',
          'COMPLETED'
        ].includes(
          value
        )
      ) {

        return 'success';

      }


      if (
        [
          'LATE',
          'OPEN',
          'OPEN_OVERDUE'
        ].includes(
          value
        )
      ) {

        return 'warning';

      }


      if (
        [
          'ABSENT',
          'ERROR',
          'REJECTED'
        ].includes(
          value
        )
      ) {

        return 'danger';

      }


      return 'warning';

    }


    function applyStatusClass(
      id,
      status
    ) {

      const element =
        document.getElementById(
          id
        );


      if (!element) {
        return;
      }


      element.classList.remove(
        'success',
        'warning',
        'danger'
      );


      element.classList.add(
        getStatusClass(
          status
        )
      );

    }


    /* =======================================================
       HTML SECURITY
       ======================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ''
          : value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }

    /* =======================================================
      CHECK-IN - UPDATE SHIFT UI
      ======================================================= */

    function updateCheckInShiftUI() {

      const mode =
        String(
          document.getElementById(
            'checkInMode'
          )?.value || ''
        )
        .trim()
        .toUpperCase();


      const employeeType =
        String(
          document.getElementById(
            'checkInEmployeeType'
          )?.value || ''
        )
        .trim()
        .toUpperCase();


      const shiftSelect =
        document.getElementById(
          'checkInShift'
        );


      const manualShift =
        document.getElementById(
          'checkInManualShift'
        );


      const officeSchedule =
        document.getElementById(
          'checkInOfficeSchedule'
        );


      const crewSchedule =
        document.getElementById(
          'checkInCrewSchedule'
        );


      const attachmentField =
        document.getElementById(
          'checkInDinasAttachmentField'
        );


      const officeDay =
        document.getElementById(
          'checkInOfficeDay'
        );


      const officeHours =
        document.getElementById(
          'checkInOfficeHours'
        );


      const officeTolerance =
        document.getElementById(
          'checkInOfficeTolerance'
        );


      const crewDay =
        document.getElementById(
          'checkInCrewDay'
        );


      if (!shiftSelect) {
        return;
      }


      /* =====================================================
        RESET TAMPILAN
        ===================================================== */

      if (manualShift) {
        manualShift.style.display = '';
      }

      shiftSelect.disabled = false;
      shiftSelect.style.display = '';


      if (officeSchedule) {
        officeSchedule.hidden = true;
      }


      if (crewSchedule) {
        crewSchedule.hidden = true;
      }


      /* =====================================================
        DINAS LUAR
        ===================================================== */

      if (attachmentField) {

        attachmentField.hidden =
          mode !== 'DINAS_LUAR';

      }


      /* =====================================================
        CREW DI ATAS KAPAL
        ===================================================== */

      if (
        mode === 'SHIP' &&
        employeeType === 'CREW'
      ) {

        shiftSelect.value = '';
        shiftSelect.disabled = true;
        shiftSelect.style.display = 'none';


        if (manualShift) {
          manualShift.style.display = 'none';
        }


        if (crewSchedule) {
          crewSchedule.hidden = false;
        }


        if (crewDay) {
          crewDay.textContent =
            'Crew Kapal';
        }


        return;
      }


      /* =====================================================
        OFFICE HOUR

        Berlaku untuk:
        - OFFICE_HOUR + WFO
        - WFH
        - DINAS_LUAR
        ===================================================== */

      const useOfficeHour =
        (
          mode === 'WFO' &&
          employeeType === 'OFFICE_HOUR'
        ) ||
        mode === 'WFH' ||
        mode === 'DINAS_LUAR';


      if (useOfficeHour) {

        shiftSelect.value = '';
        shiftSelect.disabled = true;
        shiftSelect.style.display = 'none';


        if (manualShift) {
          manualShift.style.display = 'none';
        }


        if (officeSchedule) {
          officeSchedule.hidden = false;
        }


        const now =
          new Date();

        const day =
          now.getDay();


        if (
          day >= 1 &&
          day <= 4
        ) {

          if (officeDay) {
            officeDay.textContent =
              'Office Hour · Senin – Kamis';
          }

          if (officeHours) {
            officeHours.textContent =
              '08:00 – 16:30';
          }

        }

        else if (day === 5) {

          if (officeDay) {
            officeDay.textContent =
              'Office Hour · Jumat';
          }

          if (officeHours) {
            officeHours.textContent =
              '08:00 – 17:00';
          }

        }

        else {

          if (officeDay) {
            officeDay.textContent =
              'Office Hour · Weekend';
          }

          if (officeHours) {
            officeHours.textContent =
              'Tidak ada jadwal';
          }

        }


        if (officeTolerance) {

          officeTolerance.textContent =
            'Toleransi keterlambatan 18 menit';

        }


        return;
      }

    }

    


    /* =========================================================
      CONFIRM ABSEN
      ========================================================= */

    function confirmCheckIn() {

      /*
      * Ambil value form
      */

      const mode =
        document.getElementById(
          'checkInMode'
        )?.value || '';


      const employeeType =
        document.getElementById(
          'checkInEmployeeType'
        )?.value || '';


      const shiftId =
        document.getElementById(
          'checkInShift'
        )?.value || '';


      const remark =
        document.getElementById(
          'checkInRemark'
        )?.value.trim() || '';


      /*
      * Validasi
      */

      if (!mode) {

        showAttendanceMessage(
          'Silakan pilih Mode Absen.',
          'warning'
        );

        document
          .getElementById('checkInMode')
          ?.focus();

        return;
      }


      if (!employeeType) {

        showAttendanceMessage(
          'Silakan pilih Type Pegawai.',
          'warning'
        );

        document
          .getElementById('checkInEmployeeType')
          ?.focus();

        return;
      }

      /* =====================================================
        VALIDASI LAMPIRAN DINAS LUAR
        ===================================================== */

      if (
        String(mode)
          .trim()
          .toUpperCase() === 'DINAS_LUAR'
      ) {

        const attachment =
          document.getElementById(
            'checkInDinasAttachment'
          );


        if (
          !attachment ||
          !attachment.files ||
          !attachment.files.length
        ) {

          showAttendanceMessage(
            'Surat Dinas wajib dilampirkan untuk Mode Dinas Luar.',
            'warning'
          );


          attachment?.focus();

          return;
        }

      }


      /* =====================================================
        VALIDASI SHIFT
        ===================================================== */

      const modeUpper =
        String(mode)
          .trim()
          .toUpperCase();


      const employeeTypeUpper =
        String(employeeType)
          .trim()
          .toUpperCase();


      const autoShift =
        (
          modeUpper === 'SHIP' &&
          employeeTypeUpper === 'CREW'
        ) ||
        (
          modeUpper === 'WFO' &&
          employeeTypeUpper === 'OFFICE_HOUR'
        ) ||
        modeUpper === 'WFH' ||
        modeUpper === 'DINAS_LUAR';


      /*
      * Hanya minta shift jika memang
      * menggunakan pilihan manual.
      */

      if (
        !autoShift &&
        !shiftId
      ) {

        showAttendanceMessage(
          'Silakan pilih Shift & Jam Kerja.',
          'warning'
        );


        document
          .getElementById(
            'checkInShift'
          )
          ?.focus();


        return;
      }


      /*
      * Token
      */

      SESSION_TOKEN =
        localStorage.getItem(
          'JNDA_SESSION_TOKEN'
        ) || SESSION_TOKEN;


      if (!SESSION_TOKEN) {

        showAttendanceMessage(
          'Session tidak tersedia.',
          'error'
        );

        return;
      }


      /*
      * Disable button
      */

      const button =
        document.getElementById(
          'confirmCheckInButton'
        );

      if (button) {

        button.disabled = true;

        button.dataset.originalText =
          button.innerHTML;

        button.innerHTML =
          '⏳ Memproses...';

      }


      /*
      * Payload
      */

      const payload = {

        attendanceMode:
          mode,

        employeeType:
          employeeType,

        shiftId:
          shiftId,

        remark:
          remark

      };


      console.log(
        'JNDA Check In Payload:',
        payload
      );


      /*
      * Panggil backend
      *
      * TIDAK REDIRECT
      */

      Swal.fire({

        title: 'Memproses Absen...',

        text: 'Mohon tunggu sebentar.',

        allowOutsideClick: false,

        allowEscapeKey: false,

        showConfirmButton: false,

        didOpen: function () {

          Swal.showLoading();

        }

      });

      google.script.run

        .withSuccessHandler(
          handleCheckInSuccess
        )

        .withFailureHandler(
          handleCheckInError
        )

        .checkIn(
          SESSION_TOKEN,
          payload
        );

    }

    /*
    * =====================================================
    * SERVER MENOLAK ABSEN
    * =====================================================
    *
    * Backend checkIn() dapat mengembalikan:
    *
    * {
    *   success: false,
    *   code: 'ALREADY_CHECKED_IN',
    *   message: '...'
    * }
    *
    * Jangan dianggap sebagai success.

          '#16458f',

        customClass: {
          popup:
            'jnda-swal-popup'
        }

      });


      /*
      * STOP.
      *
      * Jangan jalankan:
      * loadTodayAttendance()
      * success alert
      */

      return;
    }


    /*
    * =====================================================
    * SUCCESS
    * =====================================================
    */

    closeCheckInModal();


    /*
    * Refresh attendance.
    */

    loadTodayAttendance();


    /*
    * Notifikasi berhasil.
    */

    Swal.fire({

      icon: 'success',

      title:
        'Absen Berhasil',

      text:
        result &&
        result.message
          ? result.message
          : 'Absensi masuk berhasil dicatat.',

      showConfirmButton:
        false,

      timer:
        2000,

      timerProgressBar:
        true,

      customClass: {
        popup:
          'jnda-swal-popup'
      }

    });

  }


    /* =========================================================
      CHECK IN ERROR
      ========================================================= */

    function handleCheckInError(error) {

      console.warn(
        'JNDA Check-In ditolak:',
        error && error.message
          ? error.message
          : error
      );

      const button =
        document.getElementById(

        button.disabled = false;

        button.classList.remove(
          'loading'
        );

      /*
      * Ambil pesan asli dari backend.
      */
      let message =
        'Terjadi kesalahan saat menyimpan absensi.';

      if (
        error &&
        error.message
      ) {

        message =
          String(
            error.message
          ).trim();

      }

      /*
      * Tutup loading SweetAlert jika
      * sebelumnya digunakan.
      */
      if (
        typeof Swal !== 'undefined' &&
        Swal.isVisible()
      ) {

        Swal.close();

      /*
      * Tutup modal attendance terlebih dahulu.
      */
      closeCheckInModal();

      /*
      * Tampilkan error asli dari backend.
      */
      Swal.fire({

        icon: 'error',

        title: 'Absen Tidak Dapat Diproses',

        text: message,

        confirmButtonText: 'Mengerti',

        confirmButtonColor: '#16458f',

        customClass: {
          popup: 'jnda-swal-popup'
        }

      });

    }

    function initDinasAttachment() {

      const input =
        document.getElementById(
          'checkInDinasAttachment'
        );

      const name =
        document.getElementById(
          'checkInDinasAttachmentName'
        );


      if (!input) {
        return;
      }


      input.addEventListener(
        'change',
        function () {

          const file =
            input.files &&
            input.files[0];


          if (!file) {

            if (name) {
              name.textContent = '';
              name.classList.remove('error');
            }

            return;
          }


          const maxSize =
            5 * 1024 * 1024;


          const allowedTypes = [
            'application/pdf',
            'image/jpeg',
            'image/png'
          ];


          if (
            !allowedTypes.includes(
              file.type
            )
          ) {

            input.value = '';

            if (name) {

              name.textContent =
                'Format file tidak didukung. Gunakan PDF, JPG, JPEG atau PNG.';

              name.classList.add(
                'error'
              );

            }

            return;
          }


          if (
            file.size > maxSize
          ) {

            input.value = '';

            if (name) {

              name.textContent =
                'Ukuran file maksimal 5 MB.';

              name.classList.add(
                'error'
              );

            }

            return;
          }


          if (name) {

            name.textContent =
              '📄 ' + file.name;

            name.classList.remove(
              'error'
            );

          }

        }
      );

    }

  </script>

</body>

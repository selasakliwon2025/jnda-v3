  <script>

    /* =======================================================
       JNDA V3 - DASHBOARD PAGE
       ======================================================= */

    let SESSION_TOKEN = '';
    let CURRENT_SESSION = null;
    let DASHBOARD_DATA = null;


    /* =======================================================
       INITIALIZATION
       ======================================================= */

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        startDashboard();

        startClock();

      }
    );


    /* =======================================================
       START DASHBOARD
       ======================================================= */

    function startDashboard() {

      SESSION_TOKEN =
        localStorage.getItem(
          'JNDA_SESSION_TOKEN'
        );


      if (!SESSION_TOKEN) {

        redirectToLogin();

        return;

      }


      google.script.run
        .withSuccessHandler(
          handleDashboardSuccess
        )
        .withFailureHandler(
          handleDashboardError
        )
        .getDashboardData(
          SESSION_TOKEN
        );

    }


    /* =======================================================
       SUCCESS
       ======================================================= */

    function handleDashboardSuccess(result) {

      if (
        !result ||
        result.success === false
      ) {

        redirectToLogin();

        return;

      }


      DASHBOARD_DATA =
        result.data || result;


      CURRENT_SESSION =
        DASHBOARD_DATA.session ||
        result.session ||
        null;


      renderDashboard(
        DASHBOARD_DATA
      );

    }


    /* =======================================================
       ERROR
       ======================================================= */

    function handleDashboardError(error) {

        console.error(
          'Dashboard error:',
          error
        );

        const loading =
          document.getElementById(
            'dashboardLoading'
          );

        if (loading) {

          loading.style.display = 'flex';

          loading.innerHTML = `

            <div style="
              width:100%;
              max-width:420px;
              padding:30px;
              border-radius:20px;
              background:#ffffff;
              box-shadow:0 15px 45px rgba(15,23,42,.12);
              text-align:center;
            ">

              <div style="
                font-size:38px;
                margin-bottom:12px;
              ">
                ⚠️
              </div>

              <div style="
                font-size:18px;
                font-weight:800;
                color:#172033;
              ">
                Dashboard gagal dimuat
              </div>

              <div style="
                margin-top:8px;
                font-size:12px;
                color:#728096;
                line-height:1.6;
              ">
                Terjadi masalah saat mengambil
                data dashboard.
              </div>

              <button
                type="button"
                onclick="location.reload()"
                style="
                  margin-top:18px;
                  border:0;
                  border-radius:10px;
                  padding:11px 18px;
                  background:#16458f;
                  color:#fff;
                  font-weight:700;
                  cursor:pointer;
                "
              >
                Coba Lagi
              </button>

            </div>

          `;

        }

      }


    /* =======================================================
       RENDER DASHBOARD
       ======================================================= */

    function renderDashboard(data) {

      console.log(
        'JNDA Dashboard Data:',
        data
      );


      const employee =
        data.employee || {};


      const user =
        data.user || {};


      const role =
        data.role || {};


      const attendance =
        data.attendance || {};


      const management =
        data.management || {};


      /*
       * =====================================================
       * USER NAME
       * =====================================================
       */

      const employeeName =
        firstValidValue(
          employee.fullName,
          employee.employeeName,
          employee.name,
          user.fullName,
          user.name,
          user.username,
          'Pegawai'
        );


      const employeeId =
        firstValidValue(
          employee.employeeId,
          employee.EMPLOYEE_ID,
          user.employeeId,
          user.EMPLOYEE_ID,
          '-'
        );


      const employeeNip =
        firstValidValue(
          employee.nip,
          employee.NIP,
          employeeId,
          '-'
        );


      /*
       * =====================================================
       * ROLE
       * =====================================================
       */

      const roleName =
        firstValidValue(
          role.name,
          role.roleName,
          role.ROLE_NAME,
          user.roleName,
          user.role,
          ''
        );


      /*
       * =====================================================
       * CONTEXT
       * =====================================================
       */

      const organization =
        data.organization || {};


      const branchName =
        firstValidValue(
          organization.branch,
          employee.branchName,
          employee.BRANCH_NAME,
          employee.branch,
          '-'
        );


      const shipName =
        firstValidValue(
          organization.ship,
          employee.shipName,
          employee.SHIP_NAME,
          employee.ship,
          '-'
        );


      const positionName =
        firstValidValue(
          organization.position,
          employee.positionName,
          employee.POSITION_NAME,
          employee.position,
          '-'
        );

      const shiftName =
        firstValidValue(
          organization.shift,
          employee.shiftName,
          employee.SHIFT_NAME,
          employee.shift,
          '-'
        );


      /*
       * =====================================================
       * HERO
       * =====================================================
       */

      setText(
        'welcomeName',
        employeeName
      );


      setText(
        'welcomeEmployeeId',
        employeeId
      );


      setText(
        'welcomeContext',
        buildWorkContext(
          branchName,
          shipName
        )
      );


      /*
       * =====================================================
       * PROFILE
       * =====================================================
       */

      setText(
        'profileName',
        employeeName
      );


      setText(
        'profileEmployeeId',
        'NIP: ' + employeeNip
      );


      setInitial(
        'profileAvatar',
        employeeName
      );


      setInitial(
        'topAvatar',
        employeeName
      );


      setText(
        'topUserName',
        employeeName
      );


      setText(
        'topUserRole',
        formatRoleName(roleName)
      );


      renderProfileContext(
        branchName,
        shipName,
        positionName,
        shiftName
      );


      /*
       * =====================================================
       * INFO PENEMPATAN
       * =====================================================
       */

      setText(
        'infoBranch',
        branchName
      );


      setText(
        'infoShip',
        shipName
      );


      setText(
        'infoPosition',
        positionName
      );


      setText(
        'infoShift',
        shiftName
      );


      /*
       * =====================================================
       * ATTENDANCE
       * =====================================================
       */

      renderTodayAttendance(
        attendance
      );


      renderRecentAttendance(
        attendance
      );


      /*
       * =====================================================
       * ROLE MENU
       * =====================================================
       */

      configureRoleMenus(
        employeeId,
        roleName
      );


      /*
       * =====================================================
       * SHOW DASHBOARD
       * =====================================================
       */

      hideDashboardLoading();

    }


    /* =======================================================
       PROFILE CONTEXT
       ======================================================= */

    function renderProfileContext(
      branch,
      ship,
      position,
      shift
    ) {

      const container =
        document.getElementById(
          'profileContext'
        );


      if (!container) {
        return;
      }


      container.innerHTML = '';


      const values = [];


      if (
        branch &&
        branch !== '-'
      ) {

        values.push(
          '📍 ' + branch
        );

      }


      if (
        ship &&
        ship !== '-'
      ) {

        values.push(
          '🚢 ' + ship
        );

      }


      if (
        position &&
        position !== '-'
      ) {

        values.push(
          '💼 ' + position
        );

      }


      if (
        shift &&
        shift !== '-'
      ) {

        values.push(
          '🕐 ' + shift
        );

      }


      if (!values.length) {

        values.push(
          'Penempatan belum tersedia'
        );

      }


      values.forEach(
        function (value) {

          const chip =
            document.createElement(
              'span'
            );

          chip.className =
            'context-chip';

          chip.textContent =
            value;

          container.appendChild(
            chip
          );

        }
      );

    }


    /* =======================================================
       WORK CONTEXT
       ======================================================= */

    function buildWorkContext(
      branch,
      ship
    ) {

      if (
        ship &&
        ship !== '-'
      ) {

        return 'Kapal · ' + ship;

      }


      if (
        branch &&
        branch !== '-'
      ) {

        return 'Cabang / Unit · ' + branch;

      }


      return 'Penempatan belum tersedia';

    }


    /* =======================================================
       TODAY ATTENDANCE
       ======================================================= */

    function renderTodayAttendance(
      attendance
    ) {

      const today =
        attendance.today ||
        attendance.todayAttendance ||
        attendance.current ||
        {};


      const checkIn =
        firstValidValue(
          today.checkInAt,
          today.checkIn,
          today.CHECK_IN_AT,
          today.CHECK_IN,
          '-'
        );


      const checkOut =
        firstValidValue(
          today.checkOutAt,
          today.checkOut,
          today.CHECK_OUT_AT,
          today.CHECK_OUT,
          '-'
        );


      const working =
        firstValidValue(
          today.workingMinutes,
          today.WORKING_MINUTES,
          today.workingHour,
          today.WORKING_HOUR,
          '-'
        );


      const status =
        firstValidValue(
          today.status,
          today.STATUS,
          'Belum Absen'
        );


      setText(
        'todayCheckIn',
        formatTime(checkIn)
      );


      setText(
        'todayCheckOut',
        formatTime(checkOut)
      );


      setText(
        'todayWorkingHours',
        formatWorkingMinutes(working)
      );


      setText(
        'todayStatus',
        formatAttendanceStatus(status)
      );


      applyStatusClass(
        'todayStatus',
        status
      );

    }


    /* =======================================================
       RECENT ATTENDANCE
       ======================================================= */

    function renderRecentAttendance(
      attendance
    ) {

      const rows =
        attendance.recent ||
        attendance.recentAttendance ||
        attendance.rows ||
        [];


      const tbody =
        document.getElementById(
          'recentAttendanceBody'
        );


      if (!tbody) {
        return;
      }


      tbody.innerHTML = '';


      if (
        !Array.isArray(rows) ||
        rows.length === 0
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state">
                Belum ada data kehadiran.
              </div>
            </td>
          </tr>
        `;

        return;

      }


      rows
        .slice(0, 7)
        .forEach(
          function (row) {

            const tr =
              document.createElement(
                'tr'
              );


            const date =
              firstValidValue(
                row.workDate,
                row.WORK_DATE,
                row.attendanceDate,
                row.ATTENDANCE_DATE,
                '-'
              );


            const checkIn =
              firstValidValue(
                row.checkInAt,
                row.checkIn,
                row.CHECK_IN_AT,
                row.CHECK_IN,
                '-'
              );


            const checkOut =
              firstValidValue(
                row.checkOutAt,
                row.checkOut,
                row.CHECK_OUT_AT,
                row.CHECK_OUT,
                '-'
              );


            const working =
              firstValidValue(
                row.workingMinutes,
                row.WORKING_MINUTES,
                '-'
              );


            const status =
              firstValidValue(
                row.status,
                row.STATUS,
                '-'
              );


            tr.innerHTML = `

              <td>
                ${escapeHtml(
                  formatDate(date)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(checkIn)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(checkOut)
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatWorkingMinutes(
                    working
                  )
                )}
              </td>

              <td>
                <span class="
                  status-pill
                  ${getStatusClass(status)}
                ">
                  ${escapeHtml(
                    formatAttendanceStatus(
                      status
                    )
                  )}
                </span>
              </td>

            `;


            tbody.appendChild(
              tr
            );

          }
        );

    }


    /* =======================================================
       MANAGEMENT
       ======================================================= */

    function renderManagement(
      management
    ) {

      if (!management) {
        return;
      }


      setText(
        'managementEmployees',
        firstValidValue(
          management.activeEmployees,
          management.totalEmployees,
          management.employeeCount,
          0
        )
      );


      setText(
        'managementPresent',
        firstValidValue(
          management.presentToday,
          management.present,
          0
        )
      );


      setText(
        'managementAbsent',
        firstValidValue(
          management.absentToday,
          management.absent,
          0
        )
      );


      setText(
        'managementLate',
        firstValidValue(
          management.lateToday,
          management.late,
          0
        )
      );

    }


    /* =======================================================
       ROLE MENUS
       ======================================================= */

    function configureRoleMenus(
      employeeId,
      roleName
    ) {

      const normalized =
        normalizeRole(
          roleName
        );


      const hasEmployee =
        !!employeeId &&
        employeeId !== '-';


      const managementRoles = [
        'DIREKSI',
        'DIRECTOR',
        'DIREKTUR',
        'MANAGER',
        'BRANCH MANAGER',
        'ADMIN',
        'ADMIN HR',
        'ADMINISTRATOR'
      ];


      const adminRoles = [
        'ADMIN',
        'ADMIN HR',
        'ADMINISTRATOR'
      ];


      const isManagement =
        managementRoles.includes(
          normalized
        );


      const isAdmin =
        adminRoles.includes(
          normalized
        );


      /*
       * Employee menu:
       *
       * ADMIN dan ADMIN_HR juga masuk
       * karena mereka tetap pegawai.
       */

      const employeeMenu =
        document.getElementById(
          'employeeMenuGroup'
        );


      if (employeeMenu) {

        employeeMenu.style.display =
          hasEmployee
            ? 'block'
            : 'none';

      }


      const managementMenu =
        document.getElementById(
          'managementMenuGroup'
        );


      if (managementMenu) {

        managementMenu.style.display =
          isManagement
            ? 'block'
            : 'none';

      }


      const adminMenu =
        document.getElementById(
          'adminMenuGroup'
        );


      if (adminMenu) {

        adminMenu.style.display =
          isAdmin
            ? 'block'
            : 'none';

      }


      const managementSection =
        document.getElementById(
          'managementSection'
        );


      if (managementSection) {

        managementSection.style.display =
          isManagement
            ? 'block'
            : 'none';

      }


      /*
       * Render management data
       */

      if (isManagement) {

        renderManagement(
          DASHBOARD_DATA.management || {}
        );

      }

    }


    /* =======================================================
       ATTENDANCE NAVIGATION
       ======================================================= */

    function openAttendance(
      mode
    ) {

      closeMobileSidebar();


      navigateTo(
        'attendance',
        mode
      );

    }


    /* =======================================================
       NAVIGATION MPA
       ======================================================= */

    function navigateTo(page, mode) {

      closeMobileSidebar();

      let url =
        '?page=' +
        encodeURIComponent(page);

      if (mode) {

        url +=
          '&mode=' +
          encodeURIComponent(mode);

      }

      window.open(
        url,
        '_top'
      );

    }


    /* =======================================================
       LOGIN REDIRECT
       ======================================================= */

    function redirectToLogin() {

        localStorage.removeItem(
          'JNDA_SESSION_TOKEN'
        );

        window.open(
          '?page=login',
          '_top'
        );

      }


    function goToLogin() {

      localStorage.removeItem(
        'JNDA_SESSION_TOKEN'
      );

      const baseUrl =
        window.top.location.href
          .split('?')[0];

      window.top.location.href =
        baseUrl + '?page=login';

    }


    /* =======================================================
       LOGOUT
       ======================================================= */

      function logoutUser() {

        const token =
          SESSION_TOKEN ||
          localStorage.getItem(
            'JNDA_SESSION_TOKEN'
          );

        /*
        * Hapus token lokal terlebih dahulu.
        */
        localStorage.removeItem(
          'JNDA_SESSION_TOKEN'
        );

        SESSION_TOKEN = '';


        /*
        * Kalau tidak ada token,
        * langsung kembali ke login.
        */
        if (!token) {

          redirectToLogin();

          return;

        }


        /*
        * Hapus session di server.
        */
        google.script.run

          .withSuccessHandler(
            function () {

              redirectToLogin();

            }
          )

          .withFailureHandler(
            function (error) {

              console.error(
                'Logout server error:',
                error
              );

              /*
              * Walaupun server gagal,
              * token lokal sudah dihapus.
              */
              redirectToLogin();

            }
          )

          .destroySession(
            token
          );

      }


    /* =======================================================
       MOBILE SIDEBAR
       ======================================================= */

    function toggleMobileSidebar() {

      const sidebar =
        document.getElementById(
          'jndaSidebar'
        );


      const overlay =
        document.getElementById(
          'sidebarOverlay'
        );


      if (!sidebar) {
        return;
      }


      const opening =
        !sidebar.classList.contains(
          'mobile-open'
        );


      if (opening) {

        sidebar.classList.add(
          'mobile-open'
        );


        if (overlay) {

          overlay.classList.add(
            'mobile-open'
          );

        }

      } else {

        closeMobileSidebar();

      }

    }


    function closeMobileSidebar() {

      const sidebar =
        document.getElementById(
          'jndaSidebar'
        );


      const overlay =
        document.getElementById(
          'sidebarOverlay'
        );


      if (sidebar) {

        sidebar.classList.remove(
          'mobile-open'
        );

      }


      if (overlay) {

        overlay.classList.remove(
          'mobile-open'
        );

      }

    }


    /* =======================================================
       CLOCK
       ======================================================= */

    function startClock() {

      updateClock();


      setInterval(
        updateClock,
        1000
      );

    }


    function updateClock() {

      const now =
        new Date();


      const time =
        new Intl.DateTimeFormat(
          'id-ID',
          {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false,
            timeZone: 'Asia/Jakarta'
          }
        ).format(now);


      const date =
        new Intl.DateTimeFormat(
          'id-ID',
          {
            weekday: 'long',
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            timeZone: 'Asia/Jakarta'
          }
        ).format(now);


      setText(
        'liveClock',
        time + ' WIB'
      );


      setText(
        'pageDate',
        date
      );

    }


    /* =======================================================
       LOADING
       ======================================================= */

    function hideDashboardLoading() {

      const loading =
        document.getElementById(
          'dashboardLoading'
        );


      const content =
        document.getElementById(
          'dashboardContent'
        );


      if (loading) {

        loading.style.display =
          'none';

      }


      if (content) {

        content.style.display =
          'block';

      }

    }


    /* =======================================================
       HELPERS
       ======================================================= */

    function setText(
      id,
      value
    ) {

      const element =
        document.getElementById(
          id
        );


      if (!element) {
        return;
      }


      element.textContent =
        value == null
          ? '-'
          : String(value);

    }


    function setInitial(
      id,
      name
    ) {

      const element =
        document.getElementById(
          id
        );


      if (!element) {
        return;
      }


      const text =
        String(
          name || 'P'
        ).trim();


      element.textContent =
        text
          ? text
              .charAt(0)
              .toUpperCase()
          : 'P';

    }


    function firstValidValue() {

      const values =
        Array.from(
          arguments
        );


      for (
        let i = 0;
        i < values.length;
        i++
      ) {

        const value =
          values[i];


        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ''
        ) {

          return value;

        }

      }


      return '-';

    }


    function normalizeRole(
      role
    ) {

      return String(
        role || ''
      )
        .trim()
        .toUpperCase()
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ');

    }


    function formatRoleName(
      role
    ) {

      const normalized =
        normalizeRole(
          role
        );


      if (!normalized) {
        return 'Pegawai';
      }


      return normalized;

    }


    /* =======================================================
       DATE / TIME
       ======================================================= */

    function formatDate(
      value
    ) {

      if (
        !value ||
        value === '-'
      ) {

        return '-';

      }


      try {

        const date =
          new Date(value);


        if (
          isNaN(
            date.getTime()
          )
        ) {

          return String(value);

        }


        return new Intl.DateTimeFormat(
          'id-ID',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            timeZone: 'Asia/Jakarta'
          }
        ).format(date);

      } catch (error) {

        return String(value);

      }

    }


    function formatTime(
      value
    ) {

      if (
        !value ||
        value === '-'
      ) {

        return '-';

      }


      /*
       * Jika server sudah mengirim
       * format HH:mm / HH:mm:ss.
       */

      if (
        typeof value === 'string' &&
        /^\d{1,2}:\d{2}/.test(
          value
        )
      ) {

        return value.substring(
          0,
          5
        );

      }


      try {

        const date =
          new Date(value);


        if (
          isNaN(
            date.getTime()
          )
        ) {

          return String(value);

        }


        return new Intl.DateTimeFormat(
          'id-ID',
          {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
            timeZone: 'Asia/Jakarta'
          }
        ).format(date);

      } catch (error) {

        return String(value);

      }

    }


    function formatWorkingMinutes(
      value
    ) {

      if (
        value === undefined ||
        value === null ||
        value === '' ||
        value === '-'
      ) {

        return '-';

      }


      /*
       * V3 menggunakan WORKING_MINUTES
       * sebagai nilai authoritative.
       */

      const minutes =
        Number(value);


      if (
        !isFinite(minutes) ||
        minutes < 0
      ) {

        return '-';

      }


      const hours =
        Math.floor(
          minutes / 60
        );


      const mins =
        Math.round(
          minutes % 60
        );


      return (
        hours +
        ' jam ' +
        String(mins).padStart(
          2,
          '0'
        ) +
        ' mnt'
      );

    }


    /* =======================================================
       STATUS
       ======================================================= */

    function formatAttendanceStatus(
      status
    ) {

      const value =
        String(
          status || ''
        )
          .trim()
          .toUpperCase();


      const map = {

        PRESENT:
          'Hadir',

        HADIR:
          'Hadir',

        COMPLETE:
          'Lengkap',

        COMPLETED:
          'Lengkap',

        OPEN:
          'Belum Pulang',

        OPEN_OVERDUE:
          'Belum Pulang',

        LATE:
          'Terlambat',

        ABSENT:
          'Tidak Hadir',

        BELUM_ABSEN:
          'Belum Absen'

      };


      return (
        map[value] ||
        status ||
        '-'
      );

    }


    function getStatusClass(
      status
    ) {

      const value =
        String(
          status || ''
        )
          .trim()
          .toUpperCase();


      if (
        [
          'PRESENT',
          'HADIR',
          'COMPLETE',
          'COMPLETED'
        ].includes(
          value
        )
      ) {

        return 'success';

      }


      if (
        [
          'LATE',
          'OPEN',
          'OPEN_OVERDUE'
        ].includes(
          value
        )
      ) {

        return 'warning';

      }


      if (
        [
          'ABSENT',
          'ERROR',
          'REJECTED'
        ].includes(
          value
        )
      ) {

        return 'danger';

      }


      return 'warning';

    }


    function applyStatusClass(
      id,
      status
    ) {

      const element =
        document.getElementById(
          id
        );


      if (!element) {
        return;
      }


      element.classList.remove(
        'success',
        'warning',
        'danger'
      );


      element.classList.add(
        getStatusClass(
          status
        )
      );

    }


    /* =======================================================
       HTML SECURITY
       ======================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ''
          : value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }

    /* =======================================================
       CLOSE SIDEBAR WHEN ESC PRESSED
       ======================================================= */

    document.addEventListener(
      'keydown',
      function (event) {

        if (
          event.key === 'Escape'
        ) {

          closeMobileSidebar();

        }

      }
    );


    /* =======================================================
       AUTO CLOSE AFTER NAVIGATION CLICK
       ======================================================= */

    window.addEventListener(
      'resize',
      function () {

        if (
          window.innerWidth > 900
        ) {

          closeMobileSidebar();

        }

      }
    );

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  >

  <title>
    JNDA - Manajemen Jadwal
  </title>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</head>


<body>

  <?!= include('UI_Schedule'); ?>


  <script>

    /* ========================================================
       STATE
       ======================================================== */

   let SESSION_TOKEN = '';

    let CURRENT_USER = null;

    const WEB_APP_URL =
      <?!= JSON.stringify(WEB_APP_URL) ?>;

    let SCHEDULE_DATA = {

      employees: [],

      shifts: [],

      schedules: []

    };

    let EDITING_SCHEDULE = null;


    /* ========================================================
       INIT
       ======================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        SESSION_TOKEN =
          localStorage.getItem(
            'JNDA_SESSION_TOKEN'
          );

        if (!SESSION_TOKEN) {

          window.location.href =
            '<?!= WEB_APP_URL ?>?page=login';

          return;
        }

        initializeSchedulePage();

      }
    );


    function initializeSchedulePage() {

      setDefaultPeriod();

      loadScheduleUser();

      google.script.run

        .withSuccessHandler(
          handleSchedulePageSuccess
        )

        .withFailureHandler(
          handleScheduleError
        )

        .getSchedulePageData(
          SESSION_TOKEN
        );

    }

    /* ========================================================
      USER LOGIN
      ======================================================== */

    function loadScheduleUser() {

      if (!SESSION_TOKEN) {
        return;
      }

      google.script.run

        .withSuccessHandler(
          function(result) {

            if (
              !result ||
              result.success === false
            ) {
              return;
            }

            const data =
              result.data || result;

            CURRENT_USER =
              data;

            const employee =
              data.employee || {};

            const user =
              data.user || {};

            const role =
              data.role || {};


            const name =
              firstScheduleValue(

                employee.fullName,
                employee.employeeName,
                employee.name,

                user.fullName,
                user.name,
                user.username,

                'Pegawai'

              );


            const roleName =
              firstScheduleValue(

                role.name,
                role.roleName,
                role.ROLE_NAME,

                user.roleName,
                user.role,

                'PEGAWAI'

              );


            setScheduleText(
              'topUserName',
              name
            );


            setScheduleText(
              'topUserRole',
              formatScheduleRole(
                roleName
              )
            );


            setScheduleInitial(
              'topAvatar',
              name
            );

          }
        )

        .withFailureHandler(
          function(error) {

            console.warn(
              'JNDA Schedule User:',
              error
            );

          }
        )

        .getDashboardData(
          SESSION_TOKEN
        );

    }

    function firstScheduleValue() {

        const values =
          Array.from(arguments);

        for (
          let i = 0;
          i < values.length;
          i++
        ) {

          if (
            values[i] !== undefined &&
            values[i] !== null &&
            String(values[i]).trim() !== ''
          ) {

            return String(values[i]).trim();

          }

        }

        return '';

      }


      function setScheduleText(
        id,
        value
      ) {

        const element =
          document.getElementById(id);

        if (!element) {
          return;
        }

        element.textContent =
          value || '';

      }


      function setScheduleInitial(
        id,
        name
      ) {

        const element =
          document.getElementById(id);

        if (!element) {
          return;
        }

        const value =
          String(name || 'P')
            .trim();

        element.textContent =
          value
            ? value.charAt(0).toUpperCase()
            : 'P';

      }


      function formatScheduleRole(
        role
      ) {

        const value =
          String(role || '')
            .trim();

        if (!value) {
          return 'PEGAWAI';
        }

        return value
          .replace(/[_-]+/g, ' ')
          .replace(/\s+/g, ' ')
          .toUpperCase();

      }

    

    /* ========================================================
      NAVIGATION
      ======================================================== */

    function navigateTo(
      page,
      mode
    ) {

      closeMobileSidebar();

      let url =
        WEB_APP_URL +
        '?page=' +
        encodeURIComponent(page);

      if (mode) {

        url +=
          '&mode=' +
          encodeURIComponent(mode);

      }

      window.open(
        url,
        '_top'
      );

    }

    /* ========================================================
      MOBILE SIDEBAR
      ======================================================== */

    function toggleMobileSidebar() {

      const sidebar =
        document.getElementById(
          'jndaSidebar'
        );

      const overlay =
        document.getElementById(
          'sidebarOverlay'
        );

      if (!sidebar) {
        return;
      }

      sidebar.classList.toggle(
        'mobile-open'
      );

      if (overlay) {

        overlay.classList.toggle(
          'mobile-show'
        );

      }

    }


    function closeMobileSidebar() {

      const sidebar =
        document.getElementById(
          'jndaSidebar'
        );

      const overlay =
        document.getElementById(
          'sidebarOverlay'
        );

      if (sidebar) {

        sidebar.classList.remove(
          'mobile-open'
        );

      }

      if (overlay) {

        overlay.classList.remove(
          'mobile-show'
        );

      }

    }

    /* ========================================================
      LOGOUT
      ======================================================== */

    function logoutUser() {

      localStorage.removeItem(
        'JNDA_SESSION_TOKEN'
      );

      window.open(
        WEB_APP_URL +
        '?page=login',
        '_top'
      );

    }

    /* ========================================================
       INITIAL DATA
       ======================================================== */

    function handleSchedulePageSuccess(
      result
    ) {

      if (
        !result ||
        result.success === false
      ) {

        showError(
          result &&
          result.message
            ? result.message
            : 'Data jadwal gagal dimuat.'
        );

        return;
      }

      SCHEDULE_DATA.employees =
        result.employees || [];

      SCHEDULE_DATA.shifts =
        result.shifts || [];

      const access =
        result.access || {};

      document.getElementById(
        'scheduleBranchBadge'
      ).textContent =
        access.scope === 'ALL'
          ? '🌐 Semua Cabang'
          : '📍 ' +
            (
              access.branchName ||
              access.branchId ||
              'Cabang'
            );

      populateEmployeeSelect();

      populateShiftSelect();

      loadScheduleData();

    }


    /* ========================================================
       PERIOD
       ======================================================== */

    function setDefaultPeriod() {

      const now =
        new Date();

      const year =
        now.getFullYear();

      const month =
        now.getMonth();

      const first =
        new Date(
          year,
          month,
          1
        );

      const last =
        new Date(
          year,
          month + 1,
          0
        );

      document.getElementById(
        'scheduleStartDate'
      ).value =
        toDateInputValue(
          first
        );

      document.getElementById(
        'scheduleEndDate'
      ).value =
        toDateInputValue(
          last
        );

    }


    function loadScheduleData() {

      const startDate =
        document.getElementById(
          'scheduleStartDate'
        ).value;

      const endDate =
        document.getElementById(
          'scheduleEndDate'
        ).value;

      if (!startDate || !endDate) {

        showWarning(
          'Periode tanggal wajib diisi.'
        );

        return;
      }

      showScheduleLoading();

      google.script.run

        .withSuccessHandler(
          handleSchedulesSuccess
        )

        .withFailureHandler(
          handleScheduleError
        )

        .getSchedules(
          SESSION_TOKEN,
          startDate,
          endDate
        );

    }


    function handleSchedulesSuccess(
      result
    ) {

      hideScheduleLoading();

      if (
        !result ||
        result.success === false
      ) {

        showError(
          result &&
          result.message
            ? result.message
            : 'Jadwal gagal dimuat.'
        );

        return;
      }

      SCHEDULE_DATA.schedules =
        result.schedules || [];

      renderScheduleTable();

    }


    /* ========================================================
       SELECT
       ======================================================== */

    function populateEmployeeSelect() {

      const selects = [

        document.getElementById(
          'scheduleEmployee'
        ),

        document.getElementById(
          'scheduleFilterEmployee'
        )

      ];

      selects.forEach(function(select) {

        if (!select) {
          return;
        }

        if (
          window.jQuery &&
          $(select).hasClass(
            'select2-hidden-accessible'
          )
        ) {

          $(select).select2('destroy');

        }

        select.innerHTML = '';

        const isFilter =
          select.id ===
          'scheduleFilterEmployee';

        const firstOption =
          document.createElement(
            'option'
          );

        firstOption.value = '';

        firstOption.textContent =
          isFilter
            ? 'Semua Pegawai'
            : 'Pilih Pegawai';

        select.appendChild(
          firstOption
        );

        SCHEDULE_DATA.employees
          .forEach(function(employee) {

            const option =
              document.createElement(
                'option'
              );

            option.value =
              employee.employeeId;

            option.textContent =
              employee.fullName +
              (
                employee.employeeNo
                  ? ' · ' +
                    employee.employeeNo
                  : ''
              );

            select.appendChild(
              option
            );

          });

      });

      initializeScheduleSelect2();

    }

    function initializeScheduleSelect2() {

      if (
        !window.jQuery ||
        !$.fn.select2
      ) {
        console.warn(
          'Select2 belum tersedia.'
        );

        return;
      }

      $('#scheduleEmployee').select2({

        width: '100%',

        dropdownParent:
          $('#scheduleModalBackdrop'),

        placeholder:
          'Cari nama atau nomor pegawai...',

        allowClear:
          true

      });

      $('#scheduleFilterEmployee').select2({

        width: '100%',

        placeholder:
          'Semua Pegawai',

        allowClear:
          true

      });

      $('#scheduleFilterEmployee')
        .off('change.schedule')
        .on(
          'change.schedule',
          function() {

            renderScheduleTable();

          }
        );

    }


    function populateShiftSelect() {

      const select =
        document.getElementById(
          'scheduleShift'
        );

      select.innerHTML =
        '<option value="">Pilih Shift</option>';

      SCHEDULE_DATA.shifts
        .forEach(function(shift) {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            shift.shiftId;

          let label =
            shift.shiftId +
            ' · ' +
            shift.shiftName;

          if (
            shift.startTime ||
            shift.endTime
          ) {

            label +=
              ' (' +
              (
                shift.startTime ||
                '--:--'
              ) +
              ' - ' +
              (
                shift.endTime ||
                '--:--'
              ) +
              ')';

          }

          option.textContent =
            label;

          select.appendChild(
            option
          );

        });

    }


    /* ========================================================
       TABLE
       ======================================================== */

    function renderScheduleTable() {

      const wrapper =
        document.getElementById(
          'scheduleTableWrapper'
        );

      const empty =
        document.getElementById(
          'scheduleEmpty'
        );

      const body =
        document.getElementById(
          'scheduleTableBody'
        );

      body.innerHTML = '';

      const schedules =
        SCHEDULE_DATA.schedules || [];

      const filterEmployee =
        document.getElementById(
          'scheduleFilterEmployee'
        );

      const selectedEmployeeId =
        filterEmployee
          ? filterEmployee.value
          : '';

      const filteredSchedules =
        selectedEmployeeId
          ? schedules.filter(function(schedule) {

              return String(
                schedule.employeeId
              ) === String(
                selectedEmployeeId
              );

            })
          : schedules;

      if (!filteredSchedules.length) {

        wrapper.style.display =
          'none';

        empty.style.display =
          'block';

        return;
      }

      wrapper.style.display =
        'block';

      empty.style.display =
        'none';

      filteredSchedules.forEach(
        function(schedule) {

          const tr =
            document.createElement(
              'tr'
            );

          const shiftClass =
            String(
              schedule.shiftId
            ).toUpperCase() ===
            'S010'
              ? 'shift-badge shift-24'
              : 'shift-badge';

          tr.innerHTML = `

            <td>
              <strong>
                ${escapeHtml(
                  formatDateDisplay(
                    schedule.date
                  )
                )}
              </strong>
            </td>

            <td>

              <div class="employee-name">
                ${escapeHtml(
                  schedule.employeeName
                )}
              </div>

              <div class="employee-no">
                ${escapeHtml(
                  schedule.employeeNo || '-'
                )}
              </div>

            </td>

            <td>

              <div class="schedule-shift-info">

                <span class="${shiftClass}">

                  ${escapeHtml(
                    schedule.shiftId || '-'
                  )}

                  ·

                  ${escapeHtml(
                    schedule.shiftName || '-'
                  )}

                </span>

                <span class="schedule-shift-time">

                  🕒

                  ${escapeHtml(
                    schedule.startTime || '--:--'
                  )}

                  –

                  ${escapeHtml(
                    schedule.endTime || '--:--'
                  )}

                </span>

              </div>

            </td>

            <td>

              <span class="status-badge">
                ${escapeHtml(
                  schedule.status ||
                  'ACTIVE'
                )}
              </span>

            </td>

            <td>
              <div class="schedule-note">
                ${escapeHtml(
                  schedule.note || '-'
                )}
              </div>
            </td>

            <td>

              <button
                type="button"
                class="schedule-btn schedule-btn-secondary"
                onclick='editSchedule(${JSON.stringify(
                  schedule
                )})'
              >
                ✏️
              </button>

              <button
                type="button"
                class="schedule-btn schedule-btn-danger"
                onclick="deleteScheduleConfirm(
                  ${Number(
                    schedule.rowNumber
                  )}
                )"
              >
                🗑️
              </button>

            </td>

          `;

          body.appendChild(
            tr
          );

        }
      );

    }
    
    function getFilteredScheduleRows() {

      const schedules =
        SCHEDULE_DATA.schedules || [];

      const filter =
        document.getElementById(
          'scheduleFilterEmployee'
        );

      const employeeId =
        filter
          ? filter.value
          : '';

      if (!employeeId) {
        return schedules;
      }

      return schedules.filter(function(schedule) {

        return String(
          schedule.employeeId
        ) === String(employeeId);

      });

    }

    function downloadScheduleCsv() {

      const rows =
        getFilteredScheduleRows();

      if (!rows.length) {

        showWarning(
          'Tidak ada data jadwal untuk diunduh.'
        );

        return;

      }

      const headers = [

        'Tanggal',
        'ID Pegawai',
        'Nama Pegawai',
        'Shift',
        'Jam Mulai',
        'Jam Selesai',
        'Catatan',
        'Status'

      ];

      const data = [

        headers,

        ...rows.map(function(schedule) {

          return [

            formatDateDisplay(
              schedule.date
            ),

            schedule.employeeId || '',

            schedule.employeeName || '',

            (
              schedule.shiftId || ''
            ) +
            ' - ' +
            (
              schedule.shiftName || ''
            ),

            schedule.startTime || '',

            schedule.endTime || '',

            schedule.note || '',

            schedule.status || 'ACTIVE'

          ];

        })

      ];

      const csv =
        data.map(function(row) {

          return row.map(function(value) {

            const text =
              String(value ?? '');

            return '"' +
              text.replace(
                /"/g,
                '""'
              ) +
              '"';

          }).join(',');

        }).join('\r\n');

      const blob =
        new Blob(
          [
            '\uFEFF' + csv
          ],
          {
            type:
              'text/csv;charset=utf-8;'
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement('a');

      link.href = url;

      link.download =
        'Jadwal_Shift_JNDA.csv';

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      URL.revokeObjectURL(url);

    }

    function printScheduleReport() {

      const rows =
        getFilteredScheduleRows();

      if (!rows.length) {

        showWarning(
          'Tidak ada data jadwal untuk dicetak.'
        );

        return;

      }

      const filter =
        document.getElementById(
          'scheduleFilterEmployee'
        );

      const employeeId =
        filter
          ? filter.value
          : '';

      const employee =
        SCHEDULE_DATA.employees.find(
          function(item) {

            return String(
              item.employeeId
            ) === String(
              employeeId
            );

          }
        );

      const employeeTitle =
        employee
          ? employee.fullName +
            ' · ' +
            employee.employeeNo
          : 'Seluruh Pegawai';

      const tableRows =
        rows.map(function(schedule) {

          return `

            <tr>

              <td>
                ${escapeHtml(
                  formatDateDisplay(
                    schedule.date
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  schedule.employeeName || '-'
                )}
              </td>

              <td>
                ${escapeHtml(
                  schedule.shiftId || '-'
                )}
                -
                ${escapeHtml(
                  schedule.shiftName || '-'
                )}
                <br>
                <small>
                  ${escapeHtml(
                    schedule.startTime || '--:--'
                  )}
                  -
                  ${escapeHtml(
                    schedule.endTime || '--:--'
                  )}
                </small>
              </td>

              <td>
                ${escapeHtml(
                  schedule.note || '-'
                )}
              </td>

            </tr>

          `;

        }).join('');

      const printWindow =
        window.open(
          '',
          '_blank',
          'width=1100,height=750'
        );

      if (!printWindow) {

        showWarning(
          'Pop-up diblokir browser. Izinkan pop-up untuk mencetak.'
        );

        return;

      }

      printWindow.document.write(`

        <!DOCTYPE html>

        <html lang="id">

        <head>

          <title>
            Jadwal Shift - JNDA
          </title>

          <style>

            body {
              font-family: Arial, sans-serif;
              padding: 30px;
              color: #172033;
            }

            h1 {
              margin-bottom: 5px;
              color: #16458f;
            }

            p {
              margin-top: 5px;
              color: #667085;
            }

            table {
              width: 100%;
              border-collapse: collapse;
              margin-top: 25px;
            }

            th,
            td {
              border: 1px solid #cbd5e1;
              padding: 10px;
              text-align: left;
              font-size: 12px;
            }

            th {
              background: #edf4ff;
              color: #16458f;
            }

            @media print {

              body {
                padding: 0;
              }

            }

          </style>

        </head>

        <body>

          <h1>
            JNDA - Jadwal Shift Pegawai
          </h1>

          <p>
            Pegawai: ${escapeHtml(
              employeeTitle
            )}
          </p>

          <table>

            <thead>

              <tr>
                <th>Tanggal</th>
                <th>Pegawai</th>
                <th>Shift / Jam Kerja</th>
                <th>Catatan</th>
              </tr>

            </thead>

            <tbody>

              ${tableRows}

            </tbody>

          </table>

        </body>

        </html>

      `);

      printWindow.document.close();

      printWindow.focus();

      setTimeout(function() {

        printWindow.print();

      }, 500);

    }


    /* ========================================================
       MODAL
       ======================================================== */

    function openScheduleModal() {

      EDITING_SCHEDULE = null;

      document.getElementById(
        'scheduleModalTitle'
      ).textContent =
        'Tambah Jadwal';

      document.getElementById(
        'scheduleEmployee'
      ).value = '';

      document.getElementById(
        'scheduleDate'
      ).value =
        document.getElementById(
          'scheduleStartDate'
        ).value;

      document.getElementById(
        'scheduleShift'
      ).value = '';

      document.getElementById(
        'scheduleNote'
      ).value = '';

      document.getElementById(
        'scheduleSaveButton'
      ).textContent =
        '✓ Simpan Jadwal';

      document.getElementById(
        'scheduleModalBackdrop'
      ).classList.add(
        'show'
      );

    }


    function editSchedule(
      schedule
    ) {

      EDITING_SCHEDULE =
        schedule;

      document.getElementById(
        'scheduleModalTitle'
      ).textContent =
        'Edit Jadwal';

      const employeeSelect =
        document.getElementById(
          'scheduleEmployee'
        );

      if (employeeSelect) {

        employeeSelect.value =
          schedule.employeeId || '';

        if (
          window.jQuery &&
          $(employeeSelect).hasClass(
            'select2-hidden-accessible'
          )
        ) {

          $(employeeSelect)
            .val(schedule.employeeId || '')
            .trigger('change');

        }

      }

      document.getElementById(
        'scheduleDate'
      ).value =
        schedule.date || '';

      document.getElementById(
        'scheduleShift'
      ).value =
        schedule.shiftId || '';

      document.getElementById(
        'scheduleNote'
      ).value =
        schedule.note || '';

      document.getElementById(
        'scheduleSaveButton'
      ).textContent =
        '✓ Simpan Perubahan';

      document.getElementById(
        'scheduleModalBackdrop'
      ).classList.add(
        'show'
      );

    }


    function closeScheduleModal() {

      document.getElementById(
        'scheduleModalBackdrop'
      ).classList.remove(
        'show'
      );

    }


    /* ========================================================
       SAVE
       ======================================================== */

    function saveSchedule() {

      const employeeId =
        document.getElementById(
          'scheduleEmployee'
        ).value;

      const date =
        document.getElementById(
          'scheduleDate'
        ).value;

      const shiftId =
        document.getElementById(
          'scheduleShift'
        ).value;

      const note =
        document.getElementById(
          'scheduleNote'
        ).value.trim();

      if (!employeeId) {

        showWarning(
          'Pegawai wajib dipilih.'
        );

        return;
      }

      if (!date) {

        showWarning(
          'Tanggal wajib diisi.'
        );

        return;
      }

      if (!shiftId) {

        showWarning(
          'Shift wajib dipilih.'
        );

        return;
      }

      const payload = {

        employeeId:
          employeeId,

        date:
          date,

        shiftId:
          shiftId,

        note:
          note

      };

      const button =
        document.getElementById(
          'scheduleSaveButton'
        );

      button.disabled =
        true;

      button.textContent =
        '⏳ Menyimpan...';

      if (
        EDITING_SCHEDULE
      ) {

        payload.rowNumber =
          EDITING_SCHEDULE.rowNumber;

        google.script.run

          .withSuccessHandler(
            handleSaveScheduleSuccess
          )

          .withFailureHandler(
            handleSaveScheduleError
          )

          .updateSchedule(
            SESSION_TOKEN,
            payload
          );

      } else {

        google.script.run

          .withSuccessHandler(
            handleSaveScheduleSuccess
          )

          .withFailureHandler(
            handleSaveScheduleError
          )

          .addSchedule(
            SESSION_TOKEN,
            payload
          );

      }

    }


    function handleSaveScheduleSuccess(
      result
    ) {

      const button =
        document.getElementById(
          'scheduleSaveButton'
        );

      button.disabled =
        false;

      button.textContent =
        EDITING_SCHEDULE
          ? '✓ Simpan Perubahan'
          : '✓ Simpan Jadwal';

      if (
        !result ||
        result.success === false
      ) {

        if (
          result &&
          result.code ===
          'SCHEDULE_COLLISION'
        ) {

          Swal.fire({

            icon:
              'warning',

            title:
              'Jadwal Bentrok',

            text:
              result.message ||
              'Pegawai sudah memiliki jadwal pada tanggal tersebut.',

            confirmButtonText:
              'Mengerti',

            confirmButtonColor:
              '#16458f'

          });

          return;
        }

        showError(
          result &&
          result.message
            ? result.message
            : 'Jadwal gagal disimpan.'
        );

        return;
      }

      closeScheduleModal();

      Swal.fire({

        icon:
          'success',

        title:
          'Berhasil',

        text:
          result.message ||
          'Jadwal berhasil disimpan.',

        showConfirmButton:
          false,

        timer:
          1600

      });

      loadScheduleData();

    }


    function handleSaveScheduleError(
      error
    ) {

      const button =
        document.getElementById(
          'scheduleSaveButton'
        );

      button.disabled =
        false;

      button.textContent =
        EDITING_SCHEDULE
          ? '✓ Simpan Perubahan'
          : '✓ Simpan Jadwal';

      showError(
        error &&
        error.message
          ? error.message
          : 'Jadwal gagal disimpan.'
      );

    }


    /* ========================================================
       DELETE
       ======================================================== */

    function deleteScheduleConfirm(
      rowNumber
    ) {

      Swal.fire({

        icon:
          'warning',

        title:
          'Nonaktifkan Jadwal?',

        text:
          'Jadwal akan dinonaktifkan dan tidak dihapus dari database.',

        showCancelButton:
          true,

        confirmButtonText:
          'Ya, Nonaktifkan',

        cancelButtonText:
          'Batal',

        confirmButtonColor:
          '#be123c'

      }).then(function(result) {

        if (
          !result.isConfirmed
        ) {
          return;
        }

        google.script.run

          .withSuccessHandler(
            function(response) {

              if (
                !response ||
                response.success === false
              ) {

                showError(
                  response &&
                  response.message
                    ? response.message
                    : 'Jadwal gagal dinonaktifkan.'
                );

                return;
              }

              Swal.fire({

                icon:
                  'success',

                title:
                  'Berhasil',

                text:
                  response.message,

                showConfirmButton:
                  false,

                timer:
                  1500

              });

              loadScheduleData();

            }
          )

          .withFailureHandler(
            handleScheduleError
          )

          .deleteSchedule(
            SESSION_TOKEN,
            rowNumber
          );

      });

    }


    /* ========================================================
       LOADING
       ======================================================== */

    function showScheduleLoading() {

      document.getElementById(
        'scheduleLoading'
      ).style.display =
        'block';

      document.getElementById(
        'scheduleTableWrapper'
      ).style.display =
        'none';

      document.getElementById(
        'scheduleEmpty'
      ).style.display =
        'none';

    }


    function hideScheduleLoading() {

      document.getElementById(
        'scheduleLoading'
      ).style.display =
        'none';

    }


    /* ========================================================
       ERROR
       ======================================================== */

    function handleScheduleError(
      error
    ) {

      hideScheduleLoading();

      showError(
        error &&
        error.message
          ? error.message
          : 'Terjadi kesalahan pada modul jadwal.'
      );

    }


    function showWarning(
      message
    ) {

      Swal.fire({

        icon:
          'warning',

        title:
          'Perhatian',

        text:
          message,

        confirmButtonText:
          'Mengerti',

        confirmButtonColor:
          '#16458f'

      });

    }


    function showError(
      message
    ) {

      Swal.fire({

        icon:
          'error',

        title:
          'Gagal',

        text:
          message,

        confirmButtonText:
          'Mengerti',

        confirmButtonColor:
          '#16458f'

      });

    }


    /* ========================================================
       UTILITY
       ======================================================== */

    function toDateInputValue(
      date
    ) {

      return (
        date.getFullYear() +
        '-' +
        String(
          date.getMonth() + 1
        ).padStart(2, '0') +
        '-' +
        String(
          date.getDate()
        ).padStart(2, '0')
      );

    }


    function formatDateDisplay(
      value
    ) {

      if (!value) {
        return '-';
      }

      const parts =
        String(
          value
        ).split('-');

      if (
        parts.length !== 3
      ) {
        return value;
      }

      return (
        parts[2] +
        '/' +
        parts[1] +
        '/' +
        parts[0]
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value === undefined ||
        value === null
          ? ''
          : value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

    }


    document.addEventListener(
      'keydown',
      function(event) {

        if (
          event.key ===
          'Escape'
        ) {

          closeScheduleModal();

        }

      }
    );

  </script>

</body>

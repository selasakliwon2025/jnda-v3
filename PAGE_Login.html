<!DOCTYPE html>
<html lang="id">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title><?= APP.name ?></title>


  <!-- ======================================================
       GOOGLE FONT
       ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- ======================================================
       FONT AWESOME
       ====================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <style>

    /* ======================================================
       RESET
       ====================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      min-height: 100%;

    }


    body {

      font-family: 'Poppins', sans-serif;

      min-height: 100vh;

      overflow: hidden;

      color: #174a83;

      background: #bfe8fa;

    }


    /* ======================================================
       FULL SCREEN BACKGROUND
       ====================================================== */

    .login-background {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      background-image:

        linear-gradient(
          180deg,
          rgba(84, 165, 219, 0.05) 0%,
          rgba(255,255,255,0.00) 55%,
          rgba(220,245,255,0.08) 100%
        ),

        url(
          'https://lh3.googleusercontent.com/d/1l2t4wTl9ivGfQoP53dJgn3Vmicyy90s4'
        );

      background-size: cover;

      background-position: center center;

      background-repeat: no-repeat;

    }


    /* ======================================================
       BACKGROUND SOFT LIGHT
       ====================================================== */

    .login-background::after {

      content: "";

      position: absolute;

      inset: 0;

      background:

        linear-gradient(
          180deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.00) 45%,
          rgba(255,255,255,0.08)
        );

      pointer-events: none;

    }


    /* ======================================================
       WAVE BOTTOM
       ====================================================== */

    .wave-bottom {

      position: fixed;

      left: 0;

      bottom: 0;

      width: 100%;

      height: 23vh;

      z-index: 2;

      pointer-events: none;

      background-image:

        url(
          'https://lh3.googleusercontent.com/d/1771Mi5aQptbbIVJsM-kqtJVZaY0YG5a2'
        );

      background-size: cover;

      background-position: center bottom;

      background-repeat: no-repeat;

    }


    /* ======================================================
       PAGE WRAPPER
       ====================================================== */

    .login-page {

      position: relative;

      z-index: 3;

      width: 100%;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    /* ======================================================
       BRAND HEADER
       ====================================================== */

    .brand-header {

      position: fixed;

      top: 25px;

      left: 50%;

      transform: translateX(-50%);

      width: 100%;

      max-width: 700px;

      padding: 0 15px;

      text-align: center;

      z-index: 5;

      color: #0b3d91;

      text-shadow:
        0 1px 3px rgba(255,255,255,0.85);

    }


    /* ======================================================
       LOGO
       ====================================================== */

    .brand-logo {

      display: block;

      width: auto;

      height: 68px;

      max-width: 180px;

      object-fit: contain;

      margin: 0 auto 5px auto;

      filter:

        drop-shadow(
          0 3px 7px
          rgba(0,0,0,0.15)
        );

    }


    /* ======================================================
       APP TITLE
       ====================================================== */

    .brand-title {

      margin: 0;

      font-size: 27px;

      line-height: 1.2;

      font-weight: 700;

      letter-spacing: -0.6px;

      color: #0b3d91;

    }


    /* ======================================================
       COMPANY
       ====================================================== */

    .brand-company {

      margin: 3px 0 0 0;

      font-size: 13px;

      font-weight: 400;

      color: #315b83;

    }


    /* ======================================================
       SLOGAN
       ====================================================== */

    .brand-slogan {

      margin-top: 12px;

      color: #0b3d91;

      font-family: Georgia, 'Times New Roman', serif;

      font-size: 16px;

      font-style: italic;

      line-height: 1.45;

    }


    /* ======================================================
       LOGIN CARD
       ====================================================== */

    .login-card {

      position: relative;

      z-index: 6;

      width: 100%;

      max-width: 450px;

      margin-top: 210px;

      padding: 29px 29px 23px;

      border-radius: 25px;

      background:
        rgba(255,255,255,0.94);

      border:
        1px solid
        rgba(255,255,255,0.85);

      box-shadow:

        0 22px 60px
        rgba(22,75,120,0.18);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

    }


    /* ======================================================
       WELCOME TITLE
       ====================================================== */

    .welcome-title {

      color: #174a83;

      font-size: 25px;

      line-height: 1.25;

      font-weight: 700;

      margin-bottom: 7px;

    }


    .welcome-title .wave-hand {

      display: inline-block;

      font-size: 22px;

      margin-left: 3px;

    }


    /* ======================================================
       SUBTITLE
       ====================================================== */

    .welcome-subtitle {

      color: #73869b;

      font-size: 12px;

      line-height: 1.65;

      margin-bottom: 23px;

    }


    /* ======================================================
       FORM GROUP
       ====================================================== */

    .form-group {

      margin-bottom: 13px;

    }


    /* ======================================================
       INPUT WRAPPER
       ====================================================== */

    .input-wrapper {

      position: relative;

      width: 100%;

      height: 49px;

      border:

        1px solid
        #d9e5ef;

      border-radius: 11px;

      background:
        rgba(255,255,255,0.92);

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

      overflow: hidden;

    }


    .input-wrapper:focus-within {

      border-color: #3188e8;

      box-shadow:

        0 0 0 3px
        rgba(49,136,232,0.10);

    }


    /* ======================================================
       INPUT ICON
       ====================================================== */

    .input-icon {

      position: absolute;

      left: 0;

      top: 0;

      width: 48px;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #71879c;

      font-size: 15px;

      pointer-events: none;

    }


    /* ======================================================
       INPUT
       ====================================================== */

    .form-input {

      width: 100%;

      height: 100%;

      border: 0;

      outline: 0;

      background: transparent;

      padding:
        0 48px 0 47px;

      font-family:
        'Poppins',
        sans-serif;

      font-size: 12px;

      color: #315675;

    }


    .form-input::placeholder {

      color: #8ca0b3;

      opacity: 1;

    }


    .form-input:focus {

      outline: none;

    }


    /* ======================================================
       PASSWORD TOGGLE
       ====================================================== */

    .password-toggle {

      position: absolute;

      top: 0;

      right: 0;

      width: 47px;

      height: 100%;

      border: 0;

      background: transparent;

      color: #7a90a5;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 14px;

    }


    .password-toggle:hover {

      color: #1976d2;

    }


    /* ======================================================
       REMEMBER ROW
       ====================================================== */

    .remember-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-top: 15px;

      margin-bottom: 21px;

    }


    .remember {

      display: flex;

      align-items: center;

      gap: 7px;

      color: #5e748a;

      font-size: 11px;

      cursor: pointer;

    }


    .remember input {

      width: 17px;

      height: 17px;

      margin: 0;

      cursor: pointer;

      accent-color: #237ce5;

    }


    .forgot-password {

      border: 0;

      background: transparent;

      color: #1976e2;

      font-family: inherit;

      font-size: 11px;

      cursor: pointer;

      padding: 0;

    }


    .forgot-password:hover {

      text-decoration: underline;

    }


    /* ======================================================
       LOGIN BUTTON
       ====================================================== */

    .login-button {

      width: 100%;

      height: 51px;

      border: 0;

      border-radius: 12px;

      background:

        linear-gradient(
          135deg,
          #2d8af1,
          #176bd5
        );

      color: #ffffff;

      font-family:
        'Poppins',
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      box-shadow:

        0 9px 20px
        rgba(24,108,216,0.23);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;

    }


    .login-button:hover {

      transform:
        translateY(-1px);

      box-shadow:

        0 12px 25px
        rgba(24,108,216,0.29);

    }


    .login-button:active {

      transform:
        translateY(0);

    }


    .login-button:disabled {

      opacity: .7;

      cursor: not-allowed;

      transform: none;

    }


    .button-content {

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

    }


    /* ======================================================
       SPINNER
       ====================================================== */

    .spinner {

      width: 16px;

      height: 16px;

      border:
        2px solid
        rgba(255,255,255,.35);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* ======================================================
       SECURITY BOX
       ====================================================== */

    .security-box {

      margin-top: 15px;

      min-height: 60px;

      padding: 11px 13px;

      border-radius: 12px;

      border:
        1px solid
        #e2edf5;

      background:

        linear-gradient(
          135deg,
          rgba(247,251,255,.97),
          rgba(251,253,255,.97)
        );

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      text-align: center;

      color: #75899d;

      font-size: 10px;

      line-height: 1.5;

    }


    .security-box i {

      color: #197ce5;

      font-size: 17px;

      flex-shrink: 0;

    }


    /* ======================================================
       FOOTER
       ====================================================== */

    .login-footer {

      margin-top: 17px;

      text-align: center;

    }


    .ship-icon {

      color: #2586df;

      font-size: 20px;

      margin-bottom: 4px;

    }


    .footer-text {

      margin: 0;

      color: #7b91a7;

      font-size: 8px;

      font-weight: 500;

      letter-spacing: 2px;

    }


    /* ======================================================
       MESSAGE
       ====================================================== */

    .login-message {

      display: none;

      margin-top: 13px;

      padding: 9px 11px;

      border-radius: 9px;

      font-size: 10px;

      line-height: 1.5;

    }


    .login-message.error {

      display: block;

      color: #b42318;

      background: #fff1f0;

      border:
        1px solid
        #ffd4d0;

    }


    .login-message.success {

      display: block;

      color: #067647;

      background: #ecfdf3;

      border:
        1px solid
        #abefc6;

    }


    /* ======================================================
       DESKTOP
       ====================================================== */

    @media (min-width: 1200px) {

      .brand-header {

        top: 27px;

      }


      .brand-logo {

        height: 74px;

      }


      .brand-title {

        font-size: 29px;

      }


      .login-card {

        max-width: 450px;

        margin-top: 215px;

      }

    }


    /* ======================================================
       TABLET
       ====================================================== */

    @media (max-width: 767px) {

      body {

        overflow-y: auto;

        overflow-x: hidden;

      }


      .login-page {

        align-items: flex-start;

        padding:
          0 0 25px;

      }


      .brand-header {

        top: 17px;

      }


      .brand-logo {

        height: 57px;

      }


      .brand-title {

        font-size: 22px;

      }


      .brand-company {

        font-size: 11px;

      }


      .brand-slogan {

        margin-top: 8px;

        font-size: 13px;

      }


      .login-card {

        width:
          calc(100% - 30px);

        max-width: 450px;

        margin-top: 190px;

        padding:
          25px 21px 20px;

      }


      .wave-bottom {

        height: 20vh;

      }

    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 480px) {

      .login-background {

        background-position:
          center center;

      }


      .brand-header {

        top: 13px;

        padding:
          0 10px;

      }


      .brand-logo {

        height: 48px;

      }


      .brand-title {

        font-size: 18px;

      }


      .brand-company {

        font-size: 10px;

      }


      .brand-slogan {

        font-size: 11px;

        line-height: 1.35;

        margin-top: 6px;

      }


      .login-card {

        width:
          calc(100% - 24px);

        margin-top: 168px;

        padding:
          22px 17px 18px;

        border-radius: 22px;

      }


      .welcome-title {

        font-size: 21px;

      }


      .welcome-title .wave-hand {

        font-size: 19px;

      }


      .welcome-subtitle {

        font-size: 11px;

        margin-bottom: 19px;

      }


      .input-wrapper {

        height: 47px;

      }


      .form-input {

        font-size: 11px;

      }


      .remember {

        font-size: 10px;

      }


      .forgot-password {

        font-size: 10px;

      }


      .login-button {

        height: 48px;

        font-size: 13px;

      }


      .security-box {

        font-size: 9px;

        min-height: 56px;

      }


      .wave-bottom {

        height: 18vh;

      }

    }


    /* ======================================================
       SMALL PHONE
       ====================================================== */

    @media (max-width: 360px) {

      .brand-logo {

        height: 43px;

      }


      .brand-title {

        font-size: 16px;

      }


      .brand-company {

        font-size: 9px;

      }


      .brand-slogan {

        font-size: 10px;

      }


      .login-card {

        margin-top: 153px;

        padding:
          19px 15px 17px;

      }


      .welcome-title {

        font-size: 19px;

      }

    }

  </style>

</head>


<body>


  <!-- ======================================================
       BACKGROUND KAPAL
       ====================================================== -->

  <div class="login-background"></div>


  <!-- ======================================================
       GELOMBANG BAWAH
       ====================================================== -->

  <div class="wave-bottom"></div>


  <!-- ======================================================
       BRAND HEADER
       ====================================================== -->

  <header class="brand-header">


    <!--
      LOGO JN

      Google Drive file:
      1cWdr6D-5exT4PPHCA94zsrjyXvkK-tVp

      Pastikan file:
      Anyone with the link -> Viewer
    -->

    <img
      class="brand-logo"
      src="https://drive.google.com/thumbnail?id=1cWdr6D-5exT4PPHCA94zsrjyXvkK-tVp&sz=w500"
      alt="Logo JN"
      referrerpolicy="no-referrer"
    >


    <h1 class="brand-title">

      JN Daily Attendance

    </h1>


    <p class="brand-company">

      PT. Jembatan Nusantara

    </p>


    <p class="brand-slogan">

      Bersama Melangkah<br>

      Menuju Masa Depan

    </p>


  </header>


  <!-- ======================================================
       LOGIN PAGE
       ====================================================== -->

  <main class="login-page">


    <section class="login-card">


      <!-- ==================================================
           WELCOME
           ================================================== -->

      <h2 class="welcome-title">

        Selamat Datang

        <span class="wave-hand">
          👋
        </span>

      </h2>


      <p class="welcome-subtitle">

        Silakan login untuk melanjutkan<br>

        ke aplikasi presensi.

      </p>


      <!-- ==================================================
           LOGIN FORM
           ================================================== -->

      <form
        id="loginForm"
        onsubmit="handleLogin(event)"
      >


        <!-- ================================================
             USERNAME
             ================================================= -->

        <div class="form-group">


          <div class="input-wrapper">


            <span class="input-icon">

              <i class="fa-solid fa-user"></i>

            </span>


            <input
              id="username"
              class="form-input"
              type="text"
              autocomplete="username"
              placeholder="NIP / Email / Username"
              required
            >


          </div>


        </div>


        <!-- ================================================
             PASSWORD
             ================================================= -->

        <div class="form-group">


          <div class="input-wrapper">


            <span class="input-icon">

              <i class="fa-solid fa-lock"></i>

            </span>


            <input
              id="password"
              class="form-input"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
              required
            >


            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              onclick="togglePassword()"
              aria-label="Tampilkan password"
            >

              <i
                id="passwordIcon"
                class="fa-solid fa-eye-slash"
              ></i>

            </button>


          </div>


        </div>


        <!-- ================================================
             REMEMBER
             ================================================= -->

        <div class="remember-row">


          <label class="remember">

            <input
              type="checkbox"
              id="rememberMe"
              checked
            >

            <span>
              Ingat saya
            </span>

          </label>


          <button
            type="button"
            class="forgot-password"
            onclick="forgotPassword()"
          >

            Lupa password?

          </button>


        </div>


        <!-- ================================================
             LOGIN BUTTON
             ================================================= -->

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >

          <span
            class="button-content"
            id="buttonContent"
          >

            <i class="fa-solid fa-right-to-bracket"></i>

            <span>
              Login
            </span>

          </span>

        </button>


      </form>


      <!-- ==================================================
           MESSAGE
           ================================================== -->

      <div
        id="loginMessage"
        class="login-message"
      ></div>


      <!-- ==================================================
           SECURITY
           ================================================== -->

      <div class="security-box">


        <i class="fa-solid fa-shield-halved"></i>


        <span>

          Gunakan akun resmi perusahaan<br>

          untuk keamanan data Anda.

        </span>


      </div>


      <!-- ==================================================
           FOOTER
           ================================================== -->

      <div class="login-footer">


        <div class="ship-icon">

          <i class="fa-solid fa-ship"></i>

        </div>


        <p class="footer-text">

          JN DAILY ATTENDANCE

        </p>


      </div>


    </section>


  </main>


  <!-- ======================================================
       JAVASCRIPT
       ====================================================== -->

  <script>


    /* ======================================================
       TOGGLE PASSWORD
       ====================================================== */

    function togglePassword() {

      const password =
        document.getElementById('password');

      const icon =
        document.getElementById('passwordIcon');


      if (
        password.type === 'password'
      ) {

        password.type = 'text';


        icon.classList.remove(
          'fa-eye-slash'
        );


        icon.classList.add(
          'fa-eye'
        );

      }

      else {

        password.type = 'password';


        icon.classList.remove(
          'fa-eye'
        );


        icon.classList.add(
          'fa-eye-slash'
        );

      }

    }


    /* ======================================================
       FORGOT PASSWORD
       ====================================================== */

    function forgotPassword() {

      showMessage(
        'Silakan hubungi administrator untuk melakukan reset password.',
        'error'
      );

    }


    /* ======================================================
       LOGIN
       ====================================================== */

    function handleLogin(event) {

      event.preventDefault();


      const username =
        document
          .getElementById('username')
          .value
          .trim();


      const password =
        document
          .getElementById('password')
          .value;


      /* ====================================================
         VALIDATION
         ==================================================== */

      if (
        !username ||
        !password
      ) {

        showMessage(
          'Username dan password wajib diisi.',
          'error'
        );

        return;

      }


      /* ====================================================
         LOADING
         ==================================================== */

      setLoading(true);


      clearMessage();


      /* ====================================================
         BACKEND GAS V3

         TIDAK DIUBAH.

         Fungsi login() merupakan fungsi yang sudah
         digunakan PAGE_Login V3.
         ==================================================== */

      google.script.run

        .withSuccessHandler(
          handleLoginSuccess
        )

        .withFailureHandler(
          handleLoginFailure
        )

        .login(
          username,
          password
        );

    }


    /* ======================================================
       LOGIN SUCCESS
       ====================================================== */

    /* ======================================================
   LOGIN SUCCESS
   ====================================================== */

function handleLoginSuccess(result) {

  setLoading(false);


  /* ====================================================
     LOGIN GAGAL
     ==================================================== */

  if (
    !result ||
    !result.success
  ) {

    showMessage(

      result &&
      result.message

        ? result.message

        : 'Login gagal.',

      'error'

    );

    return;

  }


  /* ====================================================
     SESSION TOKEN

     Tetap menggunakan mekanisme PAGE_Login V3.
     ==================================================== */

  try {

    localStorage.setItem(
      'JNDA_SESSION_TOKEN',
      result.sessionToken
    );

  }

  catch (error) {

    console.error(
      'SESSION STORAGE ERROR:',
      error
    );


    showMessage(
      'Browser tidak mengizinkan penyimpanan session.',
      'error'
    );


    return;

  }


  /* ====================================================
     LOGIN BERHASIL
     ==================================================== */

  console.log(
    'JNDA LOGIN: login berhasil.'
  );


  console.log(
    'JNDA LOGIN: session token tersimpan.'
  );


  /* ====================================================
     TAMPILKAN PESAN + TOMBOL DASHBOARD
     
     Tidak menggunakan setTimeout().
     Navigasi dilakukan setelah user klik tombol.
     ==================================================== */

  const messageElement =
    document.getElementById(
      'loginMessage'
    );


  if (!messageElement) {

    console.error(
      'JNDA LOGIN: element loginMessage tidak ditemukan.'
    );

    return;

  }


  messageElement.className =
    'login-message success';


  messageElement.innerHTML = `

    <div
      style="
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:12px;
      "
    >

      <div>
        <i
          class="fa-solid fa-circle-check"
        ></i>

        &nbsp;

        Login berhasil.
      </div>


      <button
        type="button"
        onclick="openDashboard()"
        style="
          border:none;
          border-radius:10px;
          padding:10px 18px;
          background:#1976d2;
          color:#fff;
          font-weight:600;
          cursor:pointer;
          font-family:inherit;
          box-shadow:0 4px 10px rgba(0,0,0,.12);
        "
      >

        <i
          class="fa-solid fa-gauge-high"
        ></i>

        &nbsp;

        Buka Dashboard

      </button>

    </div>

  `;


  console.log(
    'JNDA LOGIN: menunggu user membuka dashboard.'
  );

}


/* ======================================================
   OPEN DASHBOARD
   ====================================================== */

function openDashboard() {

  console.log(
    'JNDA LOGIN: user klik Buka Dashboard.'
  );


  const dashboardUrl =
    '<?= WEB_APP_URL ?>?page=dashboard';


  console.log(
    'JNDA LOGIN: membuka:',
    dashboardUrl
  );


  /*
   * Navigasi dilakukan langsung dari event klik user.
   * Ini penting untuk melewati pembatasan sandbox
   * GAS HtmlService terhadap top-level navigation.
   */

  window.top.location.href =
    dashboardUrl;

}


    /* ======================================================
       LOGIN FAILURE
       ====================================================== */

    function handleLoginFailure(error) {


      setLoading(false);


      console.error(
        'LOGIN ERROR:',
        error
      );


      showMessage(
        'Terjadi kesalahan saat login. Silakan coba lagi.',
        'error'
      );

    }


    /* ======================================================
       LOADING STATE
       ====================================================== */

    function setLoading(loading) {


      const button =
        document.getElementById(
          'loginButton'
        );


      const content =
        document.getElementById(
          'buttonContent'
        );


      button.disabled =
        loading;


      if (loading) {


        content.innerHTML = `

          <span class="spinner"></span>

          <span>
            Memproses...
          </span>

        `;

      }

      else {


        content.innerHTML = `

          <i class="fa-solid fa-right-to-bracket"></i>

          <span>
            Login
          </span>

        `;

      }

    }


    /* ======================================================
       SHOW MESSAGE
       ====================================================== */

    function showMessage(
      message,
      type
    ) {


      const element =
        document.getElementById(
          'loginMessage'
        );


      element.textContent =
        message;


      element.className =
        'login-message ' +
        type;

    }


    /* ======================================================
       CLEAR MESSAGE
       ====================================================== */

    function clearMessage() {


      const element =
        document.getElementById(
          'loginMessage'
        );


      element.textContent =
        '';


      element.className =
        'login-message';

    }


    /* ======================================================
       INITIAL FOCUS
       ====================================================== */

    window.addEventListener(
      'load',
      function() {

        const username =
          document.getElementById(
            'username'
          );


        if (window.innerWidth > 600) {

          username.focus();

        }

      }
    );


  </script>

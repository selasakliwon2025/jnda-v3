<style>

  .schedule-page {
    min-height: 100vh;
    background:
      linear-gradient(
        135deg,
        #f5f8fc 0%,
        #eef3f9 100%
      );
    padding: 28px;
    font-family:
      Arial,
      Helvetica,
      sans-serif;
    color: #172033;
  }

  .schedule-container {
    max-width: 1400px;
    margin: 0 auto;
  }

  .schedule-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
  }

  .schedule-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .schedule-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #16458f;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
  }

  .schedule-title h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
  }

  .schedule-title p {
    margin: 5px 0 0;
    color: #718096;
    font-size: 13px;
  }

  .branch-badge {
    background: white;
    border: 1px solid #e1e8f0;
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #16458f;
  }

  .schedule-card {
    background: white;
    border: 1px solid #e4eaf2;
    border-radius: 18px;
    box-shadow:
      0 10px 30px rgba(15, 23, 42, .06);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .schedule-toolbar {
    padding: 18px;
    display: flex;
    align-items: end;
    gap: 14px;
    flex-wrap: wrap;
  }

  .schedule-field {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .schedule-field label {
    font-size: 12px;
    font-weight: 700;
    color: #536174;
  }

  .schedule-field input,
  .schedule-field select,
  .schedule-field textarea {
    border: 1px solid #d9e1eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    outline: none;
    background: white;
    min-width: 180px;
    box-sizing: border-box;
  }

  .schedule-field input:focus,
  .schedule-field select:focus,
  .schedule-field textarea:focus {
    border-color: #16458f;
    box-shadow:
      0 0 0 3px rgba(22, 69, 143, .08);
  }

  .schedule-btn {
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .schedule-btn-primary {
    background: #16458f;
    color: white;
  }

  .schedule-btn-secondary {
    background: #edf2f7;
    color: #344054;
  }

  .schedule-btn-danger {
    background: #fff1f2;
    color: #be123c;
  }

  .schedule-table-wrapper {
    overflow-x: auto;
  }

  .schedule-table {
    width: 100%;
    border-collapse: collapse;
  }

  .schedule-table th {
    background: #f7f9fc;
    color: #667085;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    text-align: left;
    padding: 13px 16px;
    border-bottom: 1px solid #e8edf3;
  }

  .schedule-table td {
    padding: 14px 16px;
    border-bottom: 1px solid #edf1f5;
    font-size: 13px;
    vertical-align: middle;
  }

  .schedule-table tr:hover td {
    background: #fafcff;
  }

  .employee-name {
    font-weight: 750;
    color: #172033;
  }

  .employee-no {
    margin-top: 3px;
    color: #8a96a8;
    font-size: 11px;
  }

  .shift-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #edf4ff;
    color: #16458f;
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 11px;
    font-weight: 750;
  }

  .shift-24 {
    background: #f3efff;
    color: #6d4bc2;
  }

  .status-badge {
    display: inline-flex;
    background: #ecfdf3;
    color: #087443;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 800;
  }

  .schedule-empty {
    text-align: center;
    padding: 55px 20px;
    color: #8a96a8;
  }

  .schedule-empty-icon {
    font-size: 38px;
    margin-bottom: 10px;
  }

  .schedule-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
  }

  .schedule-modal-backdrop.show {
    display: flex;
  }

  .schedule-modal {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 20px;
    box-shadow:
      0 30px 80px rgba(15, 23, 42, .25);
    overflow: hidden;
  }

  .schedule-modal-header {
    padding: 20px 22px;
    border-bottom: 1px solid #edf1f5;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .schedule-modal-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
  }

  .schedule-modal-close {
    border: 0;
    background: transparent;
    font-size: 24px;
    cursor: pointer;
    color: #7b8798;
  }

  .schedule-modal-body {
    padding: 22px;
    display: grid;
    gap: 16px;
  }

  .schedule-modal-body .schedule-field input,
  .schedule-modal-body .schedule-field select,
  .schedule-modal-body .schedule-field textarea {
    width: 100%;
    min-width: 0;
  }

  .schedule-modal-footer {
    padding: 16px 22px;
    background: #fafbfc;
    border-top: 1px solid #edf1f5;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .schedule-loading {
    text-align: center;
    padding: 40px;
    color: #718096;
  }

  @media (max-width: 700px) {

    .schedule-page {
      padding: 16px;
    }

    .schedule-header {
      align-items: flex-start;
      flex-direction: column;
    }

    .schedule-toolbar {
      align-items: stretch;
      flex-direction: column;
    }

    .schedule-field input,
    .schedule-field select {
      width: 100%;
    }

  }

</style>


<div class="schedule-page">

  <div class="schedule-container">

    <div class="schedule-header">

      <div class="schedule-title">

        <div class="schedule-icon">
          📅
        </div>

        <div>

          <h1>
            Manajemen Jadwal
          </h1>

          <p>
            Kelola jadwal kerja pegawai berdasarkan cabang.
          </p>

        </div>

      </div>

      <div
        id="scheduleBranchBadge"
        class="branch-badge"
      >
        📍 Memuat cabang...
      </div>

    </div>


    <!-- FILTER -->

    <div class="schedule-card">

      <div class="schedule-toolbar">

        <div class="schedule-field">

          <label>
            Dari Tanggal
          </label>

          <input
            type="date"
            id="scheduleStartDate"
          >

        </div>


        <div class="schedule-field">

          <label>
            Sampai Tanggal
          </label>

          <input
            type="date"
            id="scheduleEndDate"
          >

        </div>


        <button
          type="button"
          class="schedule-btn schedule-btn-primary"
          onclick="loadScheduleData()"
        >
          🔄 Tampilkan
        </button>


        <button
          type="button"
          class="schedule-btn schedule-btn-secondary"
          onclick="openScheduleModal()"
        >
          ＋ Tambah Jadwal
        </button>

      </div>

    </div>


    <!-- TABLE -->

    <div class="schedule-card">

      <div
        id="scheduleLoading"
        class="schedule-loading"
      >
        Memuat jadwal...
      </div>

      <div
        id="scheduleTableWrapper"
        class="schedule-table-wrapper"
        style="display:none;"
      >

        <table class="schedule-table">

          <thead>

            <tr>

              <th>
                Tanggal
              </th>

              <th>
                Pegawai
              </th>

              <th>
                Shift
              </th>

              <th>
                Status
              </th>

              <th>
                Catatan
              </th>

              <th>
                Aksi
              </th>

            </tr>

          </thead>

          <tbody
            id="scheduleTableBody"
          ></tbody>

        </table>

      </div>

      <div
        id="scheduleEmpty"
        class="schedule-empty"
        style="display:none;"
      >

        <div class="schedule-empty-icon">
          📅
        </div>

        Belum ada jadwal pada periode ini.

      </div>

    </div>

  </div>

</div>


<!-- MODAL -->

<div
  id="scheduleModalBackdrop"
  class="schedule-modal-backdrop"
>

  <div class="schedule-modal">

    <div class="schedule-modal-header">

      <h2 id="scheduleModalTitle">
        Tambah Jadwal
      </h2>

      <button
        type="button"
        class="schedule-modal-close"
        onclick="closeScheduleModal()"
      >
        ×
      </button>

    </div>


    <div class="schedule-modal-body">

      <div class="schedule-field">

        <label>
          Pegawai
        </label>

        <select
          id="scheduleEmployee"
        >
          <option value="">
            Pilih Pegawai
          </option>
        </select>

      </div>


      <div class="schedule-field">

        <label>
          Tanggal
        </label>

        <input
          type="date"
          id="scheduleDate"
        >

      </div>


      <div class="schedule-field">

        <label>
          Shift
        </label>

        <select
          id="scheduleShift"
        >
          <option value="">
            Pilih Shift
          </option>
        </select>

      </div>


      <div class="schedule-field">

        <label>
          Catatan
        </label>

        <textarea
          id="scheduleNote"
          rows="3"
          placeholder="Opsional"
        ></textarea>

      </div>

    </div>


    <div class="schedule-modal-footer">

      <button
        type="button"
        class="schedule-btn schedule-btn-secondary"
        onclick="closeScheduleModal()"
      >
        Batal
      </button>

      <button
        type="button"
        id="scheduleSaveButton"
        class="schedule-btn schedule-btn-primary"
        onclick="saveSchedule()"
      >
        ✓ Simpan Jadwal
      </button>

    </div>

  </div>

</div>
